<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Créations - Nova Tempo</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/partage-audio.js"></script>
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #06060A;
            --card-bg: #111118;
            --text-light: #FFFFFF;
            --text-muted: rgba(255, 255, 255, 0.6);
            --neon-lime: #D4FF00;
            --radius-md: 16px;
            --radius-lg: 24px;
        }

        body { margin: 0; padding: 0; font-family: 'Satoshi', sans-serif; background-color: var(--bg-dark); color: var(--text-light); min-height: 100vh; }
        .dashboard-container { display: flex; min-height: 100vh; }

        /* Sidebar */
        .sidebar { width: 260px; background-color: var(--bg-dark); padding: 2.5rem 2rem; border-right: 1px solid rgba(255, 255, 255, 0.05); }
        .sidebar .nova-brand-logo { margin-bottom: 3rem; }
        .nav-links { list-style: none; padding: 0; }
        .nav-links li { margin-bottom: 0.5rem; }
        .nav-links a { color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 0.95rem; display: flex; align-items: center; gap: 1rem; padding: 0.8rem 1rem; border-radius: 12px; transition: all 0.2s ease; }
        .nav-links a:hover { color: var(--text-light); background: rgba(255, 255, 255, 0.03); }
        .nav-links a.active { color: var(--neon-lime); background: rgba(212, 255, 0, 0.05); border: 1px solid rgba(212, 255, 0, 0.1); }

        /* Main Content */
        .main-content { flex: 1; padding: 3rem 4rem; max-width: 1200px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 3rem; }
        h1 { margin: 0; font-size: 2.5rem; font-weight: 900; letter-spacing: -0.03em; text-transform: uppercase; }
        .header-subtitle { margin-top: 0.5rem; color: var(--text-muted); font-size: 1.1rem; font-weight: 500; }
        
        .user-info { display: flex; align-items: center; gap: 1.5rem; }
        .user-email { font-size: 0.9rem; font-weight: 500; color: var(--text-muted); }
        .credits-badge { background: rgba(255,255,255,0.05); padding: 0.6rem 1.2rem; border-radius: 50px; border: 1px solid rgba(255, 255, 255, 0.1); color: var(--text-light); font-weight: 700; font-size: 0.9rem; }
        .credits-badge i { color: var(--neon-lime); }

        /* Grid des créations */
        .creations-grid { display: grid; grid-template-columns: 1fr; gap: 2rem; }

        .creation-card {
            background: var(--card-bg);
            border: 1px solid rgba(255,255,255,0.05);
            padding: 2.5rem;
            border-radius: var(--radius-lg);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        .creation-card:hover {
            border-color: rgba(212, 255, 0, 0.4);
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(212, 255, 0, 0.08);
        }

        .creation-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .occasion-badge {
            background: rgba(212, 255, 0, 0.1);
            color: var(--neon-lime);
            padding: 0.5rem 1rem;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .creation-date { color: var(--text-muted); font-size: 0.9rem; font-weight: 500; }
        .lyrics-content { white-space: pre-wrap; font-size: 1.05rem; line-height: 1.7; color: var(--text-light); }
        .creation-title { font-size: 1.4rem; font-weight: 900; margin: 0 0 1rem; }
        .creation-audio { width: 100%; margin-bottom: 1rem; border-radius: 12px; }
        .creation-actions { display: flex; flex-wrap: wrap; gap: 0.7rem; margin-bottom: 1.2rem; }
        .creation-actions a { display: inline-flex; align-items: center; gap: 8px; padding: 0.7rem 1.2rem; border-radius: 50px; font-weight: 700; font-size: 0.92rem; text-decoration: none; transition: all 0.2s; }
        .btn-telecharger { background: var(--neon-lime); color: #06060A; }
        .btn-whatsapp { background: #25D366; color: #fff; }
        .creation-actions a:hover { transform: translateY(-2px); }
        .creation-lyrics { border-top: 1px solid rgba(255,255,255,0.06); padding-top: 1rem; }
        .creation-lyrics-titre { color: var(--neon-lime); font-weight: 800; font-size: 0.85rem; letter-spacing: 1px; text-transform: uppercase; margin: 0 0 0.6rem; }
        @media (max-width: 600px) { .creation-card { padding: 1.4rem; } }

        .empty-state {
            text-align: center;
            padding: 6rem 2rem;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            border: 1px dashed rgba(255,255,255,0.1);
        }
        .empty-state i { font-size: 4rem; color: rgba(255,255,255,0.1); margin-bottom: 1.5rem; }
        .empty-state h3 { font-size: 1.5rem; margin-bottom: 1rem; color: var(--text-light); }
        .empty-state p { color: var(--text-muted); margin-bottom: 2rem; }
        
        .btn-main {
            background: var(--neon-lime);
            color: var(--bg-dark);
            padding: 1rem 2rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 800;
            display: inline-block;
            transition: all 0.3s;
            text-transform: uppercase;
        }
        .btn-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(212, 255, 0, 0.4);
        }

        @media (max-width: 900px) {
            .dashboard-container { flex-direction: column; }
            .sidebar { width: auto; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.05); padding: 1.5rem; }
            .main-content { padding: 2rem 1.5rem; }
            .creation-header { flex-direction: column; align-items: flex-start; gap: 1rem; }
        }
    
        /* --- Finitions responsive --- */
        .main-content { min-width: 0; }
        .header { flex-wrap: wrap; gap: 1.2rem; }
        h1 { font-size: clamp(1.8rem, 8vw, 2.5rem); overflow-wrap: anywhere; }
        .user-info { flex-wrap: wrap; gap: 0.8rem 1.2rem; min-width: 0; }
        .user-email { overflow-wrap: anywhere; }
        .creation-card { min-width: 0; }
        .creation-title { overflow-wrap: anywhere; }
        .creation-actions a { min-height: 44px; }
        .creation-audio { max-width: 100%; }
        @media (max-width: 900px) {
            .sidebar { padding: 1rem 1.2rem; }
            .sidebar .nova-brand-logo { margin-bottom: 0.8rem; }
            .nav-links { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0; }
            .nav-links li { margin: 0 !important; }
            .nav-links a { padding: 0 1rem; min-height: 44px; font-size: 0.9rem; gap: 0.6rem; }
        }
        @media (max-width: 600px) {
            .main-content { padding: 1.5rem 1rem; }
            .header { margin-bottom: 1.6rem; }
            .creation-actions a { flex: 1 1 100%; justify-content: center; }
            .empty-state { padding: 3rem 1.2rem; }
        }
    </style>
    <link rel="stylesheet" href="assets/css/logo.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <a href="index.html" class="nova-brand-logo" aria-label="Nova Tempo - Accueil">
                <div class="logo-eq-bars" aria-hidden="true">
                    <span class="eq-bar bar-1"></span>
                    <span class="eq-bar bar-2"></span>
                    <span class="eq-bar bar-3"></span>
                    <span class="eq-bar bar-4"></span>
                </div>
                <img src="assets/images/logo-nova-tempo.png" alt="Nova Tempo" class="nova-brand-img">
            </a>
            <ul class="nav-links">
                <li><a href="/studio.html"><i class="fas fa-music"></i> Studio</a></li>
                <li><a href="/creations.html" class="active"><i class="fas fa-list"></i> Mes Créations</a></li>
                <li><a href="/profil.html"><i class="fas fa-user"></i> Mon Profil</a></li>
                <li style="margin-top: 2rem;"><a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Déconnexion</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div>
                    <h1>Mes créations</h1>
                    <div class="header-subtitle">Retrouvez toutes vos histoires musicales.</div>
                </div>
                <div class="user-info">
                    <span id="userEmail" class="user-email">...</span>
                    <div class="credits-badge">
                        <i class="fas fa-bolt"></i> <span id="creditCount">--</span> crédits
                    </div>
                </div>
            </header>

            <div id="loadingMessage" style="color:var(--text-muted); text-align:center; margin-top:2rem;">
                <i class="fas fa-spinner fa-spin"></i> Chargement de vos créations...
            </div>

            <div class="creations-grid" id="creationsGrid"></div>
        </main>
    </div>

    <script>
        const supabaseUrl = 'https://wxkeuyyppzuqplnutwzk.supabase.co';
        const supabaseKey = 'sb_publishable_DrMH4qQCF4s1KyoPjvlJeA_puXHR_rr';
        window.supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        document.addEventListener('DOMContentLoaded', async () => {
            const { data: { session }, error } = await window.supabaseClient.auth.getSession();
            if (error || !session) { window.location.href = '/login.html'; return; }
            
            const currentUserId = session.user.id;
            document.getElementById('userEmail').textContent = session.user.email;

            // Credits
            const { data: profile } = await window.supabaseClient.from('profiles').select('credits').eq('id', currentUserId).single();
            if (profile) document.getElementById('creditCount').textContent = profile.credits;

            // Creations
            const { data: creations, error: fetchError } = await window.supabaseClient
                .from('tracks')
                .select('*')
                .eq('user_id', currentUserId)
                .eq('statut', 'completed')
                .order('created_at', { ascending: false });

            const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

            const grid = document.getElementById('creationsGrid');
            const loading = document.getElementById('loadingMessage');
            loading.style.display = 'none';

            if (fetchError || !creations || creations.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-music"></i>
                        <h3>Aucune création pour le moment</h3>
                        <p>Votre studio est vide. Il est temps de composer votre première émotion.</p>
                        <a href="/studio.html" class="btn-main">Créer une chanson</a>
                    </div>
                `;
                return;
            }

            creations.forEach(item => {
                const dateObj = new Date(item.created_at);
                const dateStr = dateObj.toLocaleDateString('fr-FR', { day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
                
                const card = document.createElement('div');
                card.className = 'creation-card';
                card.innerHTML = `
                    <div class="creation-header">
                        <div class="occasion-badge"><i class="fas fa-compact-disc"></i> ${esc(item.occasion)}</div>
                        <div class="creation-date">${dateStr}</div>
                    </div>
                    <h3 class="creation-title">${esc(item.titre || 'Ma chanson')}</h3>
                    ${item.url_audio ? `
                    <audio class="creation-audio" controls preload="metadata" src="${esc(item.url_audio)}"></audio>
                    <div class="creation-actions">
                        <a href="#" class="btn-whatsapp" data-action="partager"><i class="fab fa-whatsapp"></i> Envoyer sur WhatsApp</a>
                        <a href="#" class="btn-telecharger" data-action="telecharger"><i class="fas fa-download"></i> Télécharger le MP3</a>
                    </div>` : ''}
                    <div class="creation-lyrics">
                        <p class="creation-lyrics-titre">Les paroles</p>
                        <div class="lyrics-content">${esc(item.paroles)}</div>
                    </div>
                `;
                // Le fichier audio lui-même (pas un lien) : partage natif du téléphone ou téléchargement
                card.querySelectorAll('[data-action]').forEach(bouton => bouton.addEventListener('click', e => {
                    e.preventDefault();
                    const fonction = bouton.dataset.action === 'partager' ? 'partagerAudio' : 'telechargerAudio';
                    window.NovaAudio[fonction](item.url_audio, item.titre, bouton);
                }));
                grid.appendChild(card);
            });

            document.getElementById('logoutBtn').addEventListener('click', async (e) => {
                e.preventDefault(); await window.supabaseClient.auth.signOut(); window.location.href = '/login.html';
            });
        });
    </script>
</body>
</html>
