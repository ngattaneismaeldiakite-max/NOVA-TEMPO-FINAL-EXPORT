<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paramètres (Mon QG) - Nova Tempo</title>
    <style>
        :root {
            --primary-magenta: #0047AB; /* Deep Blue */
            --primary-yellow: #E60023; /* Red */
            --primary-purple: #0047AB; 
            --metallic-gradient: #E60023; /* Red */
            --bg-gray: #f7f7f8;
            --white: #ffffff;
            --text-main: #0a0a0a;
            --text-muted: #666;
        }

        body {
            margin: 0; padding: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-gray);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* SIDEBAR */
        .sidebar {
            width: 280px; background: var(--white); color: var(--text-main);
            display: flex; flex-direction: column; border-right: 1px solid #eaeaea; z-index: 10;
        }
        .nav-menu { padding: 20px 15px; display: flex; flex-direction: column; gap: 10px; }
        .nav-item {
            padding: 14px 20px; border-radius: 12px; cursor: pointer; color: var(--text-muted);
            display: flex; align-items: center; gap: 15px; text-decoration: none; font-weight: 600; transition: all 0.2s;
        }
        .nav-item:hover { background: #f0f2f5; color: var(--text-main); transform: translateX(5px); }
        .nav-item.active { background: var(--primary-magenta); color: var(--white); box-shadow: 0 8px 20px rgba(0, 71, 171, 0.4); transform: scale(1.02); }
        
        .credits-box { background: var(--white); margin: 20px; padding: 20px; border-radius: 16px; text-align: center; color: var(--text-main); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .credits-label { font-size: 11px; font-weight: 800; color: var(--text-muted); letter-spacing: 1px; text-transform: uppercase; }
        .credits-value { font-size: 32px; font-weight: 900; color: var(--text-main); margin: 5px 0; }
        .btn-recharge { width: 100%; padding: 12px; background: var(--bg-gray); border: 2px solid #eaeaea; border-radius: 10px; font-weight: 700; color: var(--text-main); cursor: pointer; transition: all 0.2s; margin-top:10px; }
        .btn-recharge:hover { border-color: var(--text-main); color: var(--text-main); }

        .user-profile { padding: 15px 20px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 12px; background: rgba(0,0,0,0.1); margin-top: auto; }
        .user-profile div span { color: rgba(255,255,255,0.6); font-size: 12px; }

        /* MAIN CONTENT */
        .main-content {
            flex: 1; display: flex; flex-direction: column; background: var(--bg-gray); overflow-y: auto;
        }
        .top-header {
            padding: 20px 30px; display: flex; justify-content: space-between; align-items: center;
            background: var(--white); border-bottom: 1px solid #eaeaea; position: sticky; top: 0; z-index: 5;
        }
        .top-header h1 { margin: 0; font-size: 24px; font-weight: 800; color: var(--text-main); }

        .settings-container {
            padding: 40px; max-width: 800px; margin: 0 auto; width: 100%; box-sizing: border-box;
        }

        .settings-card {
            background: var(--white); padding: 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.03); margin-bottom: 30px;
        }
        .settings-card h2 { margin-top: 0; font-size: 20px; color: var(--text-main); border-bottom: 2px solid var(--bg-gray); padding-bottom: 15px; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-weight: 700; margin-bottom: 8px; color: var(--text-muted); font-size: 14px; }
        .form-group input { width: 100%; padding: 12px 15px; border: 2px solid #eaeaea; border-radius: 10px; font-size: 16px; box-sizing: border-box; transition: all 0.2s; }
        .form-group input:focus { border-color: var(--text-main); outline: none; box-shadow: 0 0 0 4px rgba(0,71,171,0.1); }
        
        .btn-save { background: var(--metallic-gradient); color: var(--white); border: none; padding: 14px 24px; border-radius: 12px; font-weight: 800; font-size: 16px; cursor: pointer; transition: all 0.2s; box-shadow: 0 10px 20px rgba(230,0,35,0.3); }
        .btn-save:hover { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(230,0,35,0.4); }
        
        .btn-logout { background: transparent; color: #d93025; border: 2px solid #d93025; padding: 12px 20px; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; transition: all 0.2s; }
        .btn-logout:hover { background: #d93025; color: white; }

        @media (max-width: 768px) {
            .sidebar { display: none; }
            .settings-container { padding: 20px; }
        }
    </style>
</head>
<body>

        <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header" style="justify-content: center; padding: 20px 0; text-align: center;">
            <img src="logo.png" alt="Logo" style="height: 35px; width: auto; margin-right: 10px;">
        </div>
        
        <nav class="nav-menu">

            <a href="studio.html" class="nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg> Studio Création</a>
            <a href="bibliotheque.html" class="nav-item"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg> Ma Bibliothèque</a>
            <a href="parametres.html" class="nav-item active"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg> Paramètres (Mon QG)</a>
        </nav>
        
        <div style="flex: 1;"></div>
        
        <div style="background: var(--white); border: 1px solid #eaeaea; border-radius: 12px; padding: 15px; margin: 0 20px 20px 20px; text-align: center;">
            <p style="margin: 0; font-size: 11px; font-weight: 800; color: var(--text-muted); text-transform: uppercase;">Solde Actuel</p>
            <p class="display-credits" style="margin: 5px 0 0 0; font-size: 22px; font-weight: 800; color: var(--text-main);">150 <span style="font-size:12px;">Crédits</span></p>
            <button onclick="window.location.href='recharge.html'" style="margin-top: 10px; width: 100%; padding: 8px; background: var(--bg-gray); border: 1px solid #ddd; border-radius: 8px; font-weight: 700; cursor: pointer;">Faire un dépôt</button>
        </div>

        <div class="user-profile" style="position: relative; cursor:pointer; background: #f9f9f9; border-radius: 16px; padding: 12px; display: flex; align-items: center; gap: 12px; margin: 0 15px 15px 15px; border: 1px solid #eaeaea;" onclick="if(typeof toggleProfileMenu === 'function') toggleProfileMenu(event)">
            <div class="display-avatar" style="width:36px; height:36px; border-radius:50%; background: var(--metallic-gradient); display: flex; align-items: center; justify-content: center; color: white; flex-shrink:0;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></div>
            <div style="display:flex; flex-direction:column; justify-content:center;">
                <strong class="display-username" style="font-family: 'Inter', sans-serif; font-size: 16px; color:var(--text-main);">Utilisateur</strong>
                <span style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">Mon Compte</span>
            </div>
        </div>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        <div class="top-header">
            <h1>Paramètres (Mon QG) du compte</h1>
        </div>

        <div class="settings-container">
            <div class="settings-card">
                <h2>Profil Utilisateur</h2>
                
                <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 25px;">
                    <div style="position: relative; width: 80px; height: 80px; border-radius: 50%; background: var(--metallic-gradient); display: flex; align-items: center; justify-content: center; color: white; font-size: 32px; font-weight: 800; overflow: hidden; box-shadow: 0 5px 15px rgba(230,0,35,0.2);" id="profile-preview-container">
                        <span id="profile-initial">A</span>
                        <img id="profile-image-preview" src="" style="display:none; width: 100%; height: 100%; object-fit: cover; position: absolute; top:0; left:0;">
                        <input type="file" id="profile-upload" accept="image/*" style="display: none;" onchange="previewProfileImage(event)">
                    </div>
                    <div>
                        <button onclick="document.getElementById('profile-upload').click()" style="background: white; border: 2px solid #eaeaea; padding: 10px 16px; border-radius: 10px; font-weight: 700; cursor: pointer; color: var(--text-main); margin-bottom: 5px; transition: all 0.2s;">Changer la photo</button>
                        <div style="font-size: 13px; color: var(--text-muted);">JPG, PNG. Max 2MB.</div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Nom complet</label>
                    <input type="text" value="Awa T." placeholder="Votre nom">
                </div>
                <div class="form-group">
                    <label>Adresse Email</label>
                    <input type="email" value="awa@example.com" placeholder="Votre email" disabled style="background: #f5f5f5; cursor: not-allowed;">
                </div>
                <button class="btn-save" onclick="alert('Profil mis à jour !')">Enregistrer les modifications</button>
            </div>

            <div class="settings-card">
                <h2>Abonnement & Crédits</h2>
                <div style="display: flex; align-items: center; justify-content: space-between; background: rgba(0, 71, 171, 0.05); padding: 20px; border-radius: 12px; border: 1px solid rgba(0, 71, 171, 0.1);">
                    <div>
                        <div style="font-size: 24px; font-weight: 900; color: var(--text-main);">0 Chansons</div>
                        <div style="color: var(--text-muted); font-size: 14px; margin-top: 5px;">Crédits restants sur votre compte</div>
                    </div>
                    <button class="btn-save" onclick="window.location.href='recharge.html'">Acheter des crédits</button>
                </div>
            </div>

            <div class="settings-card">
                <h2>Sécurité</h2>
                <div class="form-group">
                    <label>Nouveau mot de passe</label>
                    <input type="password" placeholder="••••••••">
                </div>
                <button class="btn-save" style="background: var(--primary-magenta); box-shadow: 0 10px 20px rgba(0,71,171,0.3);">Mettre à jour le mot de passe</button>
            </div>

            <div style="text-align: right;">
                <button class="btn-logout" onclick="window.location.href='index.html'">Se déconnecter</button>
            </div>
        </div>
    </div>

</body>
<script>
function previewProfileImage(event) {
    const file = event.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
            const avatarSrc = e.target.result;
            // Update preview
            document.getElementById('profile-image-preview').src = avatarSrc;
            document.getElementById('profile-image-preview').style.display = 'block';
            document.getElementById('profile-initial').style.display = 'none';
            // Save to localStorage
            localStorage.setItem('nova_user_avatar', avatarSrc);
            // Update global sidebar if exists
            const displayAvatars = document.querySelectorAll('.display-avatar');
            displayAvatars.forEach(av => {
                av.innerHTML = <img src=" + avatarSrc + " style="width:100%; height:100%; border-radius:50%; object-fit:cover;">;
            });
        }
        reader.readAsDataURL(file);
    }
}
        reader.readAsDataURL(file);
    }
}
</script>
