<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio de Création - Nova Tempo</title>
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Script Supabase (Version Navigateur) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-dark: #06060A; --card-bg: #111118;
            --text-light: #FFFFFF; --text-muted: rgba(255, 255, 255, 0.6);
            --neon-lime: #D4FF00; --neon-pink: #FF0066;
        }
        body { margin: 0; padding: 0; font-family: 'Satoshi', sans-serif; background-color: var(--bg-dark); color: var(--text-light); }
        
        nav { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 4rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logo { font-size: 1.5rem; font-weight: 900; color: var(--text-light); text-decoration: none; }
        .logo i { color: var(--neon-lime); }
        .back-link { color: var(--text-muted); text-decoration: none; font-weight: 600; transition: color 0.3s; }
        .back-link:hover { color: var(--neon-lime); }
        
        .container { max-width: 800px; margin: 4rem auto; padding: 0 2rem; }
        h1 { font-size: 3rem; margin-top: 0; font-weight: 900; text-transform: uppercase; text-align: center; }
        
        .studio-card { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.05); border-radius: 24px; padding: 3rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        
        .form-group { margin-bottom: 1.5rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: var(--neon-lime); font-weight: 700; text-transform: uppercase; font-size: 0.9rem; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 1rem; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px; color: var(--text-light); font-family: inherit; font-size: 1rem;
            box-sizing: border-box; transition: all 0.3s;
        }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            outline: none; border-color: var(--neon-lime); background: rgba(212, 255, 0, 0.05);
        }
        
        .btn-submit { width: 100%; padding: 1.2rem; background: var(--neon-lime); color: var(--bg-dark); border: none; border-radius: 12px; font-weight: 800; font-size: 1.1rem; cursor: pointer; text-transform: uppercase; margin-top: 1rem; transition: transform 0.3s; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(212, 255, 0, 0.2); }
        .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        
        #error-msg { color: var(--neon-pink); background: rgba(255,0,102,0.1); padding: 1rem; border-radius: 8px; margin-top: 1rem; display: none; border: 1px solid rgba(255,0,102,0.3); font-weight: 500; }
        
        @media (max-width: 768px) {
            nav { padding: 1.5rem 2rem; }
            .studio-card { padding: 2rem; }
            h1 { font-size: 2rem; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="logo"><i class="fas fa-asterisk"></i> NOVA TEMPO</a>
        <a href="/profil.html" class="back-link"><i class="fas fa-arrow-left"></i> Retour au profil</a>
    </nav>

    <div class="container" id="app-content" style="display: none;">
        <h1>Créer une chanson</h1>
        
        <div class="studio-card">
            <form id="creation-form">
                <div class="form-group">
                    <label>Occasion</label>
                    <select id="occasion" required>
                        <option value="">Choisir une occasion...</option>
                        <option value="anniversaire">Anniversaire</option>
                        <option value="mariage">Mariage</option>
                        <option value="hommage">Hommage</option>
                        <option value="evenement">Événement / Promotion</option>
                        <option value="adoration">Adoration / Gospel</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Prénom de la personne / Sujet</label>
                    <input type="text" id="nom" placeholder="Ex: Sophie, Papa, Mon Entreprise..." required>
                </div>
                
                <div class="form-group">
                    <label>Style Musical</label>
                    <select id="genre" required>
                        <option value="">Choisir un style...</option>
                        <option value="afrobeat">Afrobeat</option>
                        <option value="amapiano">Amapiano</option>
                        <option value="rnb">R&B / Soul</option>
                        <option value="zouk">Zouk</option>
                        <option value="gospel">Gospel</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label>Une anecdote ou un détail important ?</label>
                    <textarea id="anecdote" rows="3" placeholder="Ex: On s'est rencontrés à l'université, elle adore le chocolat..."></textarea>
                </div>

                <div id="error-msg"></div>

                <button type="submit" class="btn-submit" id="btn-generate">Générer les paroles</button>
            </form>
        </div>
    </div>

    <script>
        // INITIALISATION SÉCURISÉE SUPABASE
        const supabaseUrl = 'https://wxkeuyyppzuqplnutwzk.supabase.co';
        const supabaseKey = 'sb_publishable_DrMH4qQCF4s1KyoPjvlJeA_puXHR_rr';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // VÉRIFICATION DE LA CONNEXION
        async function checkSession() {
            try {
                const { data, error } = await supabase.auth.getSession();
                if (error || !data.session) {
                    window.location.replace('/login.html'); // Retour forcé si non connecté
                    return;
                }
                // Affiche l'interface si l'utilisateur est bien connecté
                document.getElementById('app-content').style.display = 'block';
            } catch (err) {
                console.error("Erreur session:", err);
            }
        }
        checkSession();

        // GESTION DU FORMULAIRE SÉCURISÉE (Avec bloc try/catch)
        document.getElementById('creation-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('btn-generate');
            const errorMsg = document.getElementById('error-msg');
            
            // On bloque le bouton pendant le chargement
            btn.disabled = true;
            btn.textContent = "Génération en cours...";
            errorMsg.style.display = 'none';

            // Récupération des données
            const payload = {
                occasion: document.getElementById('occasion').value,
                nom: document.getElementById('nom').value,
                genre: document.getElementById('genre').value,
                anecdote: document.getElementById('anecdote').value
            };

            try {
                // Appel sécurisé vers ton API Vercel
                const response = await fetch('/api/generate-lyrics', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Une erreur est survenue lors de la génération.");
                }

                // Succès : Affiche une alerte propre (ou redirige vers une autre étape)
                alert("Paroles générées avec succès ! (Code à relier au lecteur audio)");
                console.log("Paroles :", data.lyrics);
                
                btn.textContent = "Générer les paroles";
                btn.disabled = false;

            } catch (err) {
                // Gestion des erreurs propre (Le site ne crash pas, il affiche un texte rouge)
                console.error(err);
                errorMsg.textContent = "Impossible de joindre le serveur. Vérifiez votre connexion ou l'API Vercel.";
                errorMsg.style.display = 'block';
                
                btn.textContent = "Réessayer";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
