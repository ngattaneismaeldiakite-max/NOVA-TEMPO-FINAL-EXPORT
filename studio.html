<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Studio - Nova Tempo</title>
    
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    
    <style>
        :root { --bg-dark: #06060A; --card-bg: #111118; --text-light: #FFFFFF; --text-muted: rgba(255, 255, 255, 0.6); --neon-lime: #D4FF00; --neon-pink: #FF0066; }
        body { margin: 0; padding: 0; font-family: 'Satoshi', sans-serif; background-color: var(--bg-dark); color: var(--text-light); min-height: 100vh; position: relative; }
        
        .bg-image { position: fixed; inset: 0; background-image: url('fille-casque.jpg'); background-size: cover; background-position: center; opacity: 0.2; filter: blur(5px); z-index: -1; }
        
        nav { padding: 1.5rem 4rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); background: rgba(6, 6, 10, 0.6); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.5rem; font-weight: 900; color: var(--text-light); text-decoration: none; }
        .logo i { color: var(--neon-lime); }
        
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-links a { color: var(--text-light); text-decoration: none; font-weight: 600; transition: color 0.3s; display: flex; align-items: center; gap: 8px; }
        .nav-links a:hover { color: var(--neon-lime); }
        
        .btn-logout { background: transparent; border: 1px solid var(--neon-pink); color: var(--neon-pink); padding: 0.5rem 1.5rem; border-radius: 50px; cursor: pointer; font-weight: bold; transition: all 0.3s; display: flex; align-items: center; gap: 8px; }
        .btn-logout:hover { background: var(--neon-pink); color: white; }

        .container { max-width: 800px; margin: 3rem auto; padding: 0 2rem; position: relative; z-index: 1; }
        h1 { font-size: 3rem; text-transform: uppercase; margin-bottom: 0.5rem; text-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        h1 span { color: var(--neon-lime); }
        .subtitle { color: rgba(255,255,255,0.9); font-size: 1.1rem; margin-bottom: 3rem; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }

        .studio-card { background: rgba(17, 17, 24, 0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 3rem; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        
        .form-group { margin-bottom: 2.5rem; }
        .form-group label.main-label { display: block; margin-bottom: 1rem; color: var(--text-light); font-size: 1.1rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        
        input[type="text"], textarea { width: 100%; padding: 1.2rem; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; font-family: inherit; font-size: 1rem; box-sizing: border-box; transition: all 0.3s; }
        input:focus, textarea:focus { outline: none; border-color: var(--neon-lime); background: rgba(212, 255, 0, 0.05); box-shadow: 0 0 15px rgba(212, 255, 0, 0.1); }
        
        .dynamic-field { margin-bottom: 1.5rem; animation: fadeIn 0.5s ease; text-align: left; }
        .dynamic-field label { display: block; margin-bottom: 0.6rem; color: var(--text-muted); font-size: 0.95rem; font-weight: 600; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .radio-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1rem; }
        .radio-card input { display: none; }
        .radio-card { cursor: pointer; display: block; }
        .card-content { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 1rem; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; transition: all 0.3s; font-weight: 600; text-align: center; color: var(--text-muted); font-size: 0.95rem; }
        
        .radio-card:hover .card-content { border-color: rgba(212, 255, 0, 0.5); color: white; }
        .radio-card input:checked + .card-content { background: rgba(212, 255, 0, 0.1); border-color: var(--neon-lime); color: var(--neon-lime); box-shadow: 0 0 15px rgba(212, 255, 0, 0.2); transform: translateY(-2px); }

        .btn-generate { width: 100%; padding: 1.2rem; background: var(--neon-lime); color: var(--bg-dark); border: none; border-radius: 12px; font-weight: 900; font-size: 1.2rem; cursor: pointer; text-transform: uppercase; margin-top: 2rem; transition: transform 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px; box-shadow: 0 10px 30px rgba(212, 255, 0, 0.2); }
        .btn-generate:hover { transform: translateY(-3px); box-shadow: 0 15px 40px rgba(212, 255, 0, 0.4); }
        .btn-generate:disabled { background: #333; color: #888; cursor: not-allowed; box-shadow: none; transform: none; }

        #result-container { display: none; margin-top: 2rem; padding: 1.5rem; background: rgba(212, 255, 0, 0.1); border: 1px solid var(--neon-lime); border-radius: 12px; text-align: center; }
        audio { width: 100%; margin-top: 1rem; outline: none; }

        #page-loader { position: fixed; inset: 0; background: var(--bg-dark); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 0.5s; }
        .spinner { width: 50px; height: 50px; border: 4px solid rgba(212, 255, 0, 0.3); border-top-color: var(--neon-lime); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 1rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        @media (max-width: 768px) {
            nav { padding: 1rem; flex-direction: column; gap: 1rem; }
            .radio-grid { grid-template-columns: repeat(2, 1fr); }
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>
    <div id="page-loader">
        <div class="spinner"></div>
        <div style="color: var(--neon-lime); font-weight: bold; text-transform: uppercase;">Vérification...</div>
    </div>

    <nav>
        <a href="/" class="logo"><i class="fas fa-asterisk"></i> NOVA TEMPO</a>
        <div class="nav-links">
            <a href="/profil.html"><i class="fas fa-user"></i> Mon Profil</a>
            <button class="btn-logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Déconnexion</button>
        </div>
    </nav>

    <div class="container">
        <h1>Le <span>Studio</span></h1>
        <p class="subtitle">Réponds à quelques questions, NovaTempo crée la magie.</p>

        <div class="studio-card">
            <form id="studio-form" onsubmit="handleGenerate(event)">
                
                <div class="form-group">
                    <label class="main-label">1. Pour qui est cette chanson ?</label>
                    <input type="text" id="target-name" required placeholder="Ex: Ma mère, Mon copain Marc, Ma femme...">
                </div>
                
                <div class="form-group">
                    <label class="main-label">2. Quelle est l'occasion ?</label>
                    <div class="radio-grid">
                        <label class="radio-card"><input type="radio" name="occasion" value="anniversaire" required onchange="genererFormulaireOccasion(this.value)"><span class="card-content">🎂 Anniversaire</span></label>
                        <label class="radio-card"><input type="radio" name="occasion" value="amour" onchange="genererFormulaireOccasion(this.value)"><span class="card-content">❤️ Amour</span></label>
                        <label class="radio-card"><input type="radio" name="occasion" value="mariage" onchange="genererFormulaireOccasion(this.value)"><span class="card-content">💍 Mariage</span></label>
                        <label class="radio-card"><input type="radio" name="occasion" value="hommage" onchange="genererFormulaireOccasion(this.value)"><span class="card-content">🕊️ Hommage</span></label>
                        <label class="radio-card"><input type="radio" name="occasion" value="adoration" onchange="genererFormulaireOccasion(this.value)"><span class="card-content">🙌 Adoration</span></label>
                        <label class="radio-card"><input type="radio" name="occasion" value="evenement" onchange="genererFormulaireOccasion(this.value)"><span class="card-content">🎉 Événement</span></label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="main-label">3. Quel style musical ?</label>
                    <div class="radio-grid">
                        <label class="radio-card"><input type="radio" name="style" value="Afrobeat" required><span class="card-content">🌍 Afrobeat</span></label>
                        <label class="radio-card"><input type="radio" name="style" value="Rap Français"><span class="card-content">🎤 Rap Français</span></label>
                        <label class="radio-card"><input type="radio" name="style" value="Coupé Décalé"><span class="card-content">🕺 Coupé Décalé</span></label>
                        <label class="radio-card"><input type="radio" name="style" value="Zouk"><span class="card-content">💃 Zouk</span></label>
                        <label class="radio-card"><input type="radio" name="style" value="Amapiano"><span class="card-content">🔥 Amapiano</span></label>
                        <label class="radio-card"><input type="radio" name="style" value="Ndombolo"><span class="card-content">🎸 Ndombolo</span></label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="main-label">4. Quelle voix ?</label>
                    <div class="radio-grid">
                        <label class="radio-card"><input type="radio" name="voice" value="male" required><span class="card-content">👨 Homme</span></label>
                        <label class="radio-card"><input type="radio" name="voice" value="female"><span class="card-content">👩 Femme</span></label>
                        <label class="radio-card"><input type="radio" name="voice" value="duo"><span class="card-content">👫 Duo</span></label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="main-label">5. Les détails (Personnalisation)</label>
                    <div id="dynamic-form-container" style="padding: 1rem; border: 1px dashed rgba(212,255,0,0.3); border-radius: 12px; color: var(--text-muted);">
                        <div style="text-align: center;">Veuillez sélectionner une occasion ci-dessus.</div>
                    </div>
                </div>

                <button type="submit" class="btn-generate" id="generate-btn">
                    <i class="fas fa-magic"></i> Générer ma chanson (1 crédit)
                </button>
            </form>

            <div id="result-container">
                <h3 style="color: var(--neon-lime); margin-top: 0;">🎉 Ta chanson est prête !</h3>
                <p>Écoute ta création exclusive NovaTempo :</p>
                <audio id="audio-player" controls></audio>
            </div>

        </div>
    </div>

    <script>
        const supabaseUrl = 'https://wxkeuyyppzuqplnutwzk.supabase.co';
        const supabaseKey = 'sb_publishable_DrMH4qQCF4s1KyoPjvlJeA_puXHR_rr';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) window.location.href = '/login.html'; 
            else {
                document.getElementById('page-loader').style.opacity = '0';
                setTimeout(() => { document.getElementById('page-loader').style.display = 'none'; }, 500);
            }
        });

        async function logout() {
            await supabaseClient.auth.signOut();
            window.location.href = '/login.html';
        }
        
        const questionsPersonnalisees = {
            'anniversaire': `
                <div class="dynamic-field"><label>Âge fêté :</label><input type="text" class="custom-data" data-label="Âge" required placeholder="Ex: 30 ans"></div>
                <div class="dynamic-field"><label>Quelles sont ses passions ou hobbies ?</label><input type="text" class="custom-data" data-label="Passions" required placeholder="Ex: Il adore le football et les jeux vidéos"></div>
                <div class="dynamic-field"><label>Une anecdote amusante à placer ?</label><input type="text" class="custom-data" data-label="Anecdote" placeholder="Ex: Il perd toujours ses clés"></div>
            `,
            'amour': `
                <div class="dynamic-field"><label>Quel est son petit surnom ou mot doux ?</label><input type="text" class="custom-data" data-label="Surnom" placeholder="Ex: Mon amour, Mon ange, Chaton..."></div>
                <div class="dynamic-field"><label>Qu'aimez-vous le plus chez cette personne ?</label><input type="text" class="custom-data" data-label="Ce que j'aime" required placeholder="Ex: Son sourire radieux, sa douceur..."></div>
                <div class="dynamic-field"><label>Un souvenir marquant ou une promesse ?</label><input type="text" class="custom-data" data-label="Souvenir ou Promesse" required placeholder="Ex: Je t'aimerai toujours..."></div>
            `,
            'mariage': `
                <div class="dynamic-field"><label>Comment ou où se sont-ils rencontrés ?</label><input type="text" class="custom-data" data-label="Lieu de rencontre" required placeholder="Ex: À la fac de médecine en 2018"></div>
                <div class="dynamic-field"><label>Que souhaitez-vous mettre en avant dans leur couple ?</label><input type="text" class="custom-data" data-label="Force du couple" required placeholder="Ex: Leur complicité et leurs voyages"></div>
                <div class="dynamic-field"><label>Un message pour leur futur ?</label><input type="text" class="custom-data" data-label="Vœux" required placeholder="Ex: Beaucoup d'enfants et de rires"></div>
            `,
            'adoration': `
                <div class="dynamic-field"><label>Quel attribut divin voulez-vous exalter ?</label><input type="text" class="custom-data" data-label="Attribut" required placeholder="Ex: Sa miséricorde, Sa toute puissance"></div>
                <div class="dynamic-field"><label>Quel est le thème spirituel de la chanson ?</label><input type="text" class="custom-data" data-label="Thème" required placeholder="Ex: Le pardon, la victoire, la paix intérieure"></div>
                <div class="dynamic-field"><label>Avez-vous un verset ou une prière spécifique ?</label><input type="text" class="custom-data" data-label="Verset/Prière" placeholder="Ex: Psaume 23, ou 'Me voici devant Toi'"></div>
            `,
            'hommage': `
                <div class="dynamic-field"><label>Quel est le plus beau souvenir de cette personne ?</label><input type="text" class="custom-data" data-label="Souvenir" required placeholder="Ex: Ses grands repas de famille le dimanche"></div>
                <div class="dynamic-field"><label>Quelle était sa plus grande qualité ?</label><input type="text" class="custom-data" data-label="Qualité" required placeholder="Ex: Sa générosité infinie"></div>
            `,
            'evenement': `
                <div class="dynamic-field"><label>Quel est le nom et le but de l'événement ?</label><input type="text" class="custom-data" data-label="Nom de l'événement" required placeholder="Ex: Lancement de notre nouvelle marque"></div>
                <div class="dynamic-field"><label>Quelle est l'ambiance ou le message à faire passer ?</label><input type="text" class="custom-data" data-label="Ambiance" required placeholder="Ex: Festif, inspirant et motivant pour l'avenir"></div>
            `
        };

        function genererFormulaireOccasion(occasion) {
            const container = document.getElementById('dynamic-form-container');
            if (questionsPersonnalisees[occasion]) {
                container.innerHTML = questionsPersonnalisees[occasion];
            } else {
                container.innerHTML = `<textarea class="custom-data" data-label="Histoire" required placeholder="Racontez votre histoire ici..."></textarea>`;
            }
        }

        async function handleGenerate(event) {
            event.preventDefault(); 
            const btn = document.getElementById('generate-btn');
            
            const cible = document.getElementById('target-name').value;
            const occasion = document.querySelector('input[name="occasion"]:checked').value;
            const style = document.querySelector('input[name="style"]:checked').value;
            const voice = document.querySelector('input[name="voice"]:checked').value;
            
            let histoireAssemblee = "";
            document.querySelectorAll('.custom-data').forEach(champ => {
                if(champ.value.trim() !== "") {
                    histoireAssemblee += `- ${champ.getAttribute('data-label')} : ${champ.value.trim()}\n`;
                }
            });

            const promptFinal = `Fais une chanson pour : ${cible}.\nC'est pour l'occasion : ${occasion}.\nDétails importants :\n${histoireAssemblee}`;

            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Préparation du studio NovaTempo...';
            
            // Phrases amusantes pour l'attente
            const phrasesAttente = [
                "🎸 Les musiciens accordent leurs guitares...",
                "🎤 Le chanteur s'échauffe la voix...",
                "🎹 Mixage de la piste audio en cours...",
                "🎧 NovaTempo finalise les derniers réglages...",
                "✨ La magie opère, encore quelques secondes..."
            ];
            let phraseIndex = 0;

            try {
                const resCreation = await fetch('/api/songs/generate-audio', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        lyrics: promptFinal,
                        genre: style,
                        voice: voice
                    })
                });

                const dataCreation = await resCreation.json();
                
                if (dataCreation.error || !dataCreation.job_id) {
                    throw new Error(dataCreation.error || "Pas de Job ID reçu.");
                }

                const jobId = dataCreation.job_id;

                const verificationIntervalle = setInterval(async () => {
                    try {
                        const resStatut = await fetch(`/api/songs/check-status?id=${jobId}`);
                        const dataStatut = await resStatut.json();

                        if (dataStatut.status === 'completed' && dataStatut.outputs && dataStatut.outputs.length > 0) {
                            clearInterval(verificationIntervalle);
                            document.getElementById('studio-form').style.display = 'none';
                            document.getElementById('result-container').style.display = 'block';
                            
                            const laChanson = dataStatut.outputs[0];
                            const urlAudio = laChanson.audio_url || laChanson.url || laChanson.song_path;
                            
                            document.getElementById('audio-player').src = urlAudio;
                            document.getElementById('audio-player').play();
                        } else if (dataStatut.status === 'failed') {
                            clearInterval(verificationIntervalle);
                            alert("Oups ! Nos musiciens ont rencontré un petit problème. Essaie de modifier un peu le texte et réessaie.");
                            btn.disabled = false;
                            btn.innerHTML = '<i class="fas fa-magic"></i> Réessayer';
                        } else {
                            // Affichage des phrases sympas au lieu de la réponse de l'API
                            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> ' + phrasesAttente[phraseIndex];
                            phraseIndex = (phraseIndex + 1) % phrasesAttente.length;
                        }
                    } catch (errCheck) {
                        console.error(errCheck);
                    }
                }, 5000); 

            } catch (erreur) {
                console.error(erreur);
                alert("Oups ! Problème de connexion avec le studio. " + erreur.message);
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-magic"></i> Réessayer';
            }
        }
    </script>
</body>
</html>
