<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio - Nova Tempo</title>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #FF3366;
            --bg-dark: #0A0A0A;
            --bg-card: #1A1A1A;
            --text: #FFFFFF;
            --text-muted: #888888;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text);
            min-height: 100vh;
        }

        .dashboard-container {
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar */
        .sidebar {
            width: 250px;
            background-color: var(--bg-card);
            padding: 2rem;
            border-right: 1px solid rgba(255,255,255,0.1);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 3rem;
            background: linear-gradient(45deg, var(--primary), #FF8833);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            list-style: none;
            padding: 0;
        }

        .nav-links li {
            margin-bottom: 1rem;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            transition: 0.3s ease;
        }

        .nav-links a:hover, .nav-links a.active {
            color: var(--text);
            background: rgba(255, 51, 102, 0.1);
        }

        .nav-links i {
            color: var(--primary);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            padding: 3rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .credits-badge {
            background: rgba(255, 51, 102, 0.1);
            padding: 0.5rem 1rem;
            border-radius: 20px;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-weight: 600;
        }

        /* Studio Area */
        .studio-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        .creation-panel, .preview-panel {
            background: var(--bg-card);
            padding: 2rem;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 2rem;
            font-size: 1.5rem;
        }

        /* Formulaires */
        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        select, input[type="text"], textarea {
            width: 100%;
            padding: 1rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: var(--text);
            font-family: inherit;
            box-sizing: border-box;
        }

        select {
            appearance: none;
            cursor: pointer;
        }

        .occasion-fields {
            background: rgba(0,0,0,0.2);
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(255,51,102,0.2);
        }

        .hidden {
            display: none;
        }

        .btn-generate {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(45deg, var(--primary), #FF8833);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-generate:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        
        .btn-generate:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Style spécifique pour les paroles */
        .lyrics-display {
            background: rgba(0,0,0,0.3);
            padding: 1.5rem;
            border-radius: 8px;
            min-height: 200px;
            white-space: pre-wrap;
            font-family: 'Montserrat', sans-serif;
            line-height: 1.6;
            margin-top: 1rem;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .loader {
            display: none;
            margin: 2rem auto;
            text-align: center;
        }
        
        .loader.active {
            display: block;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255,51,102,0.3);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            color: var(--primary);
            background: rgba(255,51,102,0.1);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        /* Responsive */
        @media (max-width: 900px) {
            .dashboard-container {
                flex-direction: column;
            }
            .sidebar {
                width: auto;
                border-right: none;
                border-bottom: 1px solid rgba(255,255,255,0.1);
            }
            .studio-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">NOVA TEMPO</div>
            <ul class="nav-links">
                <li><a href="#" class="active"><i class="fas fa-music"></i> Studio</a></li>
                <li><a href="#"><i class="fas fa-list"></i> Mes Créations</a></li>
                <li><a href="#"><i class="fas fa-user"></i> Mon Profil</a></li>
                <li><a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Déconnexion</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <h1>Le Studio</h1>
                <div class="user-info">
                    <span id="userEmail" class="text-muted">...</span>
                    <div class="credits-badge">
                        <i class="fas fa-coins"></i> <span id="creditCount">--</span> crédits
                    </div>
                </div>
            </header>

            <div class="studio-grid">
                <!-- Panneau de création -->
                <div class="creation-panel">
                    <h2>Créer une chanson</h2>
                    
                    <div id="errorBox" class="error-message"></div>

                    <form id="generateForm">
                        <div class="form-group">
                            <label for="occasion">Occasion *</label>
                            <select id="occasion" required>
                                <option value="">Choisir une occasion...</option>
                                <option value="amour">Déclaration d'amour</option>
                                <option value="anniversaire">Anniversaire</option>
                                <option value="hommage">Hommage</option>
                                <option value="promotion">Promotion / Événement</option>
                                <option value="adoration">Louange et Adoration</option>
                            </select>
                        </div>

                        <!-- CHAMPS : AMOUR -->
                        <div id="fields-amour" class="occasion-fields hidden">
                            <div class="form-group">
                                <label>Prénom du destinataire *</label>
                                <input type="text" id="amour-prenom" placeholder="Ex: Sophie">
                            </div>
                            <div class="form-group">
                                <label>Surnom (Optionnel)</label>
                                <input type="text" id="amour-surnom" placeholder="Ex: Mon ange">
                            </div>
                            <div class="form-group">
                                <label>Une qualité clé *</label>
                                <input type="text" id="amour-qualite1" placeholder="Ex: Ta douceur">
                            </div>
                            <div class="form-group">
                                <label>Une deuxième qualité *</label>
                                <input type="text" id="amour-qualite2" placeholder="Ex: Ton sourire">
                            </div>
                            <div class="form-group">
                                <label>Une troisième qualité *</label>
                                <input type="text" id="amour-qualite3" placeholder="Ex: Ta force">
                            </div>
                            <div class="form-group">
                                <label>Un souvenir marquant (Optionnel)</label>
                                <input type="text" id="amour-souvenir" placeholder="Ex: Notre voyage à Rome">
                            </div>
                        </div>

                        <!-- CHAMPS : ANNIVERSAIRE -->
                        <div id="fields-anniversaire" class="occasion-fields hidden">
                            <div class="form-group">
                                <label>Prénom *</label>
                                <input type="text" id="anniv-prenom" placeholder="Ex: Thomas">
                            </div>
                            <div class="form-group">
                                <label>Âge (Optionnel)</label>
                                <input type="text" id="anniv-age" placeholder="Ex: 30">
                            </div>
                            <div class="form-group">
                                <label>Qualité principale *</label>
                                <input type="text" id="anniv-qualite1" placeholder="Ex: Ta bonne humeur">
                            </div>
                            <div class="form-group">
                                <label>Deuxième qualité *</label>
                                <input type="text" id="anniv-qualite2" placeholder="Ex: Ta fidélité">
                            </div>
                            <div class="form-group">
                                <label>Souvenir à rappeler (Optionnel)</label>
                                <input type="text" id="anniv-souvenir" placeholder="Ex: La soirée du nouvel an">
                            </div>
                            <div class="form-group">
                                <label>Message spécial *</label>
                                <input type="text" id="anniv-message" placeholder="Ex: Ne change jamais">
                            </div>
                        </div>

                        <!-- CHAMPS : HOMMAGE -->
                        <div id="fields-hommage" class="occasion-fields hidden">
                            <div class="form-group">
                                <label>Prénom de la personne *</label>
                                <input type="text" id="hommage-nom" placeholder="Ex: Papa, Marie...">
                            </div>
                            <div class="form-group">
                                <label>Votre lien (Optionnel)</label>
                                <input type="text" id="hommage-lien" placeholder="Ex: Mon père, mon ami d'enfance...">
                            </div>
                            <div class="form-group">
                                <label>Qualité 1 *</label>
                                <input type="text" id="hommage-qualite1" placeholder="Ex: Son grand cœur">
                            </div>
                            <div class="form-group">
                                <label>Qualité 2 *</label>
                                <input type="text" id="hommage-qualite2" placeholder="Ex: Sa sagesse">
                            </div>
                            <div class="form-group">
                                <label>Qualité 3 *</label>
                                <input type="text" id="hommage-qualite3" placeholder="Ex: Sa joie de vivre">
                            </div>
                            <div class="form-group">
                                <label>Un beau souvenir (Optionnel)</label>
                                <input type="text" id="hommage-souvenir" placeholder="Ex: Ses récits au coin du feu">
                            </div>
                            <div class="form-group">
                                <label>Une valeur qu'il/elle a transmise *</label>
                                <input type="text" id="hommage-valeur" placeholder="Ex: Le courage, la persévérance...">
                            </div>
                            <div class="form-group">
                                <label>Qui rend cet hommage ? (Optionnel)</label>
                                <input type="text" id="hommage-proches" placeholder="Ex: Tes enfants, toute la famille...">
                            </div>
                        </div>

                        <!-- CHAMPS : PROMOTION -->
                        <div id="fields-promotion" class="occasion-fields hidden">
                            <div class="form-group">
                                <label>Nom du produit / événement / entreprise *</label>
                                <input type="text" id="pro-nom" placeholder="Ex: Le festival d'été, Ma super app...">
                            </div>
                            <div class="form-group">
                                <label>Type de produit/événement (Optionnel)</label>
                                <input type="text" id="pro-type" placeholder="Ex: Un festival de musique, Une application révolutionnaire...">
                            </div>
                            <div class="form-group">
                                <label>Point fort 1 *</label>
                                <input type="text" id="pro-point1" placeholder="Ex: Innovant">
                            </div>
                            <div class="form-group">
                                <label>Point fort 2 *</label>
                                <input type="text" id="pro-point2" placeholder="Ex: Pas cher">
                            </div>
                            <div class="form-group">
                                <label>Point fort 3 *</label>
                                <input type="text" id="pro-point3" placeholder="Ex: Écologique">
                            </div>
                            <div class="form-group">
                                <label>Lieu (Optionnel)</label>
                                <input type="text" id="pro-lieu" placeholder="Ex: À Paris, Sur notre site web...">
                            </div>
                            <div class="form-group">
                                <label>Date / Période (Optionnel)</label>
                                <input type="text" id="pro-date" placeholder="Ex: Ce week-end, Disponible maintenant...">
                            </div>
                            <div class="form-group">
                                <label>Public cible (Optionnel)</label>
                                <input type="text" id="pro-public" placeholder="Ex: Les jeunes, Les entrepreneurs...">
                            </div>
                            <div class="form-group">
                                <label>Action attendue (Optionnel)</label>
                                <input type="text" id="pro-action" placeholder="Ex: Téléchargez l'app, Venez nombreux...">
                            </div>
                        </div>

                        <!-- CHAMPS : ADORATION -->
                        <div id="fields-adoration" class="occasion-fields hidden">
                            <div class="form-group">
                                <label>Nom de Dieu / Titre (ex: Jésus, Éternel, Yahweh) *</label>
                                <input type="text" id="ado-nom" placeholder="Ex: Jésus">
                            </div>
                            <div class="form-group">
                                <label>Attribut 1 (ex: Puissant, Bon) *</label>
                                <input type="text" id="ado-attribut1" placeholder="Ex: Puissant">
                            </div>
                            <div class="form-group">
                                <label>Attribut 2 (ex: Saint, Miséricordieux) *</label>
                                <input type="text" id="ado-attribut2" placeholder="Ex: Saint">
                            </div>
                            <div class="form-group">
                                <label>Attribut 3 (ex: Majestueux, Merveilleux) *</label>
                                <input type="text" id="ado-attribut3" placeholder="Ex: Merveilleux">
                            </div>
                            <div class="form-group">
                                <label>Votre Prénom (Optionnel)</label>
                                <input type="text" id="ado-prenom" placeholder="Ex: Marie">
                            </div>
                            <div class="form-group">
                                <label>Votre situation / Témoignage (Optionnel)</label>
                                <input type="text" id="ado-situation" placeholder="Ex: Il m'a guéri">
                            </div>
                            <div class="form-group">
                                <label>Verset biblique préféré (Optionnel)</label>
                                <input type="text" id="ado-verset" placeholder="Ex: Psaume 23, Jean 3:16">
                            </div>
                        </div>

                        <button type="submit" class="btn-generate" id="submitBtn">
                            <i class="fas fa-magic"></i> Générer les paroles
                        </button>
                    </form>
                </div>

                <!-- Panneau de résultat -->
                <div class="preview-panel">
                    <h2>Vos Paroles</h2>
                    
                    <div id="loader" class="loader">
                        <div class="spinner"></div>
                        <p>Création des paroles en cours...</p>
                    </div>

                    <div id="resultDisplay" class="lyrics-display" style="display: none;"></div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- INITIALISATION DE SUPABASE ICI ---
        const supabaseUrl = 'URL_SUPABASE_ICI';
        const supabaseKey = 'CLE_ANON_ICI';
        window.supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
        // ---------------------------------------

        document.addEventListener('DOMContentLoaded', async () => {
            // VÉRIFICATION DE L'AUTHENTIFICATION
            const { data: { session }, error } = await window.supabaseClient.auth.getSession();
            
            if (error || !session) {
                window.location.href = '/login.html';
                return;
            }

            document.getElementById('userEmail').textContent = session.user.email;
            document.getElementById('creditCount').textContent = '3';

            // GESTION DU DÉROULANT DES OCCASIONS
            const occasionSelect = document.getElementById('occasion');
            const fieldsMap = {
                amour: 'fields-amour',
                anniversaire: 'fields-anniversaire',
                hommage: 'fields-hommage',
                promotion: 'fields-promotion',
                adoration: 'fields-adoration'
            };

            occasionSelect.addEventListener('change', (e) => {
                Object.values(fieldsMap).forEach(id => {
                    document.getElementById(id).classList.add('hidden');
                    const inputs = document.getElementById(id).querySelectorAll('input');
                    inputs.forEach(input => {
                        if (input.previousElementSibling.textContent.includes('*')) {
                            input.removeAttribute('required');
                        }
                    });
                });

                const selected = e.target.value;
                if (fieldsMap[selected]) {
                    const block = document.getElementById(fieldsMap[selected]);
                    block.classList.remove('hidden');
                    const inputs = block.querySelectorAll('input');
                    inputs.forEach(input => {
                        if (input.previousElementSibling.textContent.includes('*')) {
                            input.setAttribute('required', 'true');
                        }
                    });
                }
            });

            // SOUMISSION DU FORMULAIRE ET APPEL API
            const form = document.getElementById('generateForm');
            const submitBtn = document.getElementById('submitBtn');
            const errorBox = document.getElementById('errorBox');
            const loader = document.getElementById('loader');
            const resultDisplay = document.getElementById('resultDisplay');

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const occasion = document.getElementById('occasion').value;

                if (!occasion) {
                    showError('Veuillez sélectionner une occasion.');
                    return;
                }

                // Préparer les données pour l'API
                const payload = {
                    occasion: occasion
                };

                // Ajouter les champs spécifiques selon l'occasion
                if (occasion === 'amour') {
                    payload['amour-prenom'] = document.getElementById('amour-prenom').value;
                    payload['amour-surnom'] = document.getElementById('amour-surnom').value;
                    payload['amour-qualite1'] = document.getElementById('amour-qualite1').value;
                    payload['amour-qualite2'] = document.getElementById('amour-qualite2').value;
                    payload['amour-qualite3'] = document.getElementById('amour-qualite3').value;
                    payload['amour-souvenir'] = document.getElementById('amour-souvenir').value;
                } else if (occasion === 'anniversaire') {
                    payload['anniv-prenom'] = document.getElementById('anniv-prenom').value;
                    payload['anniv-age'] = document.getElementById('anniv-age').value;
                    payload['anniv-qualite1'] = document.getElementById('anniv-qualite1').value;
                    payload['anniv-qualite2'] = document.getElementById('anniv-qualite2').value;
                    payload['anniv-souvenir'] = document.getElementById('anniv-souvenir').value;
                    payload['anniv-message'] = document.getElementById('anniv-message').value;
                } else if (occasion === 'hommage') {
                    payload['hommage-nom'] = document.getElementById('hommage-nom').value;
                    payload['hommage-lien'] = document.getElementById('hommage-lien').value;
                    payload['hommage-qualite1'] = document.getElementById('hommage-qualite1').value;
                    payload['hommage-qualite2'] = document.getElementById('hommage-qualite2').value;
                    payload['hommage-qualite3'] = document.getElementById('hommage-qualite3').value;
                    payload['hommage-souvenir'] = document.getElementById('hommage-souvenir').value;
                    payload['hommage-valeur'] = document.getElementById('hommage-valeur').value;
                    payload['hommage-proches'] = document.getElementById('hommage-proches').value;
                } else if (occasion === 'promotion') {
                    payload['pro-nom'] = document.getElementById('pro-nom').value;
                    payload['pro-type'] = document.getElementById('pro-type').value;
                    payload['pro-point1'] = document.getElementById('pro-point1').value;
                    payload['pro-point2'] = document.getElementById('pro-point2').value;
                    payload['pro-point3'] = document.getElementById('pro-point3').value;
                    payload['pro-lieu'] = document.getElementById('pro-lieu').value;
                    payload['pro-date'] = document.getElementById('pro-date').value;
                    payload['pro-public'] = document.getElementById('pro-public').value;
                    payload['pro-action'] = document.getElementById('pro-action').value;
                } else if (occasion === 'adoration') {
                    payload['ado-nom'] = document.getElementById('ado-nom').value;
                    payload['ado-attribut1'] = document.getElementById('ado-attribut1').value;
                    payload['ado-attribut2'] = document.getElementById('ado-attribut2').value;
                    payload['ado-attribut3'] = document.getElementById('ado-attribut3').value;
                    payload['ado-prenom'] = document.getElementById('ado-prenom').value;
                    payload['ado-situation'] = document.getElementById('ado-situation').value;
                    payload['ado-verset'] = document.getElementById('ado-verset').value;
                }

                try {
                    submitBtn.disabled = true;
                    errorBox.style.display = 'none';
                    resultDisplay.style.display = 'none';
                    loader.classList.add('active');

                    const response = await fetch('/api/songs/generate-lyrics', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(payload)
                    });

                    if (!response.ok) {
                        throw new Error('Erreur réseau');
                    }

                    const data = await response.json();
                    
                    if (data.error) {
                        throw new Error(data.error);
                    }

                    resultDisplay.textContent = data.lyrics;
                    resultDisplay.style.display = 'block';

                } catch (error) {
                    console.error('Erreur:', error);
                    showError('Une erreur est survenue lors de la génération.');
                } finally {
                    submitBtn.disabled = false;
                    loader.classList.remove('active');
                }
            });

            // Gérer la déconnexion
            document.getElementById('logoutBtn').addEventListener('click', async (e) => {
                e.preventDefault();
                await window.supabaseClient.auth.signOut();
                window.location.href = '/login.html';
            });

            function showError(message) {
                errorBox.textContent = message;
                errorBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
