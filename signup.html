<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Nova Tempo</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --nova-violet: #7B5193;
            --nova-corail: #E86F5A;
            --nova-orange: #F18A40;
            --nova-jaune: #F2A841;
            --nova-blanc-casse: #F7F4EE;
            --nova-noir: #111216;
            --radius-sm: 12px;
            --radius-md: 18px;
            --radius-lg: 24px;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Satoshi', sans-serif;
            background-color: var(--nova-blanc-casse);
            color: var(--nova-noir);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-container {
            background: #FFFFFF;
            padding: 4rem 3rem;
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(17, 18, 22, 0.04);
            box-shadow: 0 10px 40px rgba(0,0,0,0.03);
            text-align: center;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 900;
            margin-bottom: 2rem;
            color: var(--nova-noir);
            letter-spacing: -0.02em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.2rem;
        }

        .logo-burst {
            color: var(--nova-corail);
            font-size: 1.4rem;
            margin-top: -10px;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 2rem;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: -0.03em;
        }

        .serif-italic {
            font-family: 'Instrument Serif', serif;
            font-style: italic;
            font-weight: normal;
            color: var(--nova-corail);
            font-size: 1.15em;
        }

        .btn-google {
            width: 100%;
            padding: 1.1rem;
            background: var(--nova-blanc-casse);
            color: var(--nova-noir);
            border: 1px solid rgba(17, 18, 22, 0.1);
            border-radius: var(--radius-sm);
            font-weight: 600;
            font-size: 1rem;
            font-family: 'Satoshi', sans-serif;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.8rem;
            transition: all 0.2s ease;
        }

        .btn-google:hover {
            background: #FFFFFF;
            border-color: rgba(17, 18, 22, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        .divider {
            text-align: center;
            margin: 2rem 0;
            color: rgba(17, 18, 22, 0.4);
            font-size: 0.9rem;
            position: relative;
            font-weight: 500;
        }
        .divider::before, .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 30%;
            height: 1px;
            background: rgba(17, 18, 22, 0.1);
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--nova-noir);
        }

        input {
            width: 100%;
            padding: 1.1rem 1.2rem;
            background: var(--nova-blanc-casse);
            border: 1px solid rgba(17, 18, 22, 0.08);
            border-radius: var(--radius-sm);
            color: var(--nova-noir);
            font-family: 'Satoshi', sans-serif;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }

        input:focus {
            outline: none;
            border-color: var(--nova-corail);
            background: #FFFFFF;
            box-shadow: 0 0 0 4px rgba(232, 111, 90, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 1.2rem;
            background: linear-gradient(90deg, var(--nova-violet), var(--nova-corail), var(--nova-orange), var(--nova-jaune));
            background-size: 200% 200%;
            border: none;
            border-radius: var(--radius-md);
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            font-family: 'Satoshi', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 0.5rem;
            box-shadow: 0 4px 15px rgba(232, 111, 90, 0.2);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(232, 111, 90, 0.3);
            background-position: 100% 0;
        }

        .error-message {
            color: var(--nova-corail);
            background: rgba(232, 111, 90, 0.1);
            padding: 1rem;
            border-radius: var(--radius-sm);
            margin-bottom: 1.5rem;
            font-weight: 500;
            font-size: 0.9rem;
            display: none;
        }

        .links {
            margin-top: 2rem;
            color: rgba(17, 18, 22, 0.6);
            font-size: 0.95rem;
        }

        .links a {
            color: var(--nova-noir);
            text-decoration: none;
            font-weight: 700;
            border-bottom: 1px solid var(--nova-noir);
            padding-bottom: 2px;
            transition: 0.2s;
        }

        .links a:hover {
            color: var(--nova-corail);
            border-bottom-color: var(--nova-corail);
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo">NOVA<span class="logo-burst">✦</span>TEMPO</div>
        <h2>Écrire la <span class="serif-italic">musique</span></h2>

        <div id="errorBox" class="error-message"></div>

        <button id="googleBtn" type="button" class="btn-google">
            <i class="fab fa-google" style="color: #DB4437;"></i> S'inscrire avec Google
        </button>

        <div class="divider">ou avec un email</div>

        <form id="signupForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="password" required minlength="6" placeholder="6 caractères minimum">
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">Créer mon compte</button>
        </form>

        <div class="links">
            <p>Déjà une histoire ? <a href="/login.html">Se connecter</a></p>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://wxkeuyyppzuqplnutwzk.supabase.co';
        const supabaseKey = 'sb_publishable_DrMH4qQCF4s1KyoPjvlJeA_puXHR_rr';
        window.supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('signupForm');
            const submitBtn = document.getElementById('submitBtn');
            const errorBox = document.getElementById('errorBox');
            const googleBtn = document.getElementById('googleBtn');

            function showError(message) {
                errorBox.textContent = message;
                errorBox.style.display = 'block';
            }

            googleBtn.addEventListener('click', async () => {
                try {
                    const { data, error } = await window.supabaseClient.auth.signInWithOAuth({
                        provider: 'google',
                        options: { redirectTo: window.location.origin + '/studio.html' }
                    });
                    if (error) throw error;
                } catch (error) {
                    showError("Erreur Google : " + error.message);
                }
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                try {
                    submitBtn.disabled = true;
                    submitBtn.textContent = 'Création...';
                    errorBox.style.display = 'none';

                    const { data, error } = await window.supabaseClient.auth.signUp({
                        email: email, password: password,
                    });

                    if (error) throw error;
                    window.location.href = '/studio.html';

                } catch (error) {
                    let msg = error.message;
                    if (msg.includes("User already registered")) msg = "Cet email est déjà utilisé.";
                    showError(msg);
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Créer mon compte';
                }
            });
        });
    </script>
</body>
</html>
