<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Nova Tempo</title>
    
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-dark: #06060A; --card-bg: #111118;
            --text-light: #FFFFFF; --text-muted: rgba(255, 255, 255, 0.6);
            --neon-lime: #D4FF00; --neon-pink: #FF0066;
        }
        body { margin: 0; padding: 0; font-family: 'Satoshi', sans-serif; background-color: var(--bg-dark); color: var(--text-light); min-height: 100vh; display: flex; flex-direction: column; }
        
        nav { padding: 1.5rem 4rem; position: absolute; width: 100%; box-sizing: border-box; }
        .logo { font-size: 1.5rem; font-weight: 900; color: var(--text-light); text-decoration: none; }
        .logo i { color: var(--neon-lime); }
        
        .auth-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 2rem; position: relative; }
        
        .bg-image { position: absolute; inset: 0; background-image: url('fille-casque.jpg'); background-size: cover; background-position: center; opacity: 0.3; filter: blur(5px); z-index: 0; }
        
        .auth-card { background: rgba(17, 17, 24, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 3rem; width: 100%; max-width: 450px; z-index: 1; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .auth-card h2 { font-size: 2rem; text-transform: uppercase; margin-top: 0; margin-bottom: 2rem; text-align: center; color: var(--neon-lime); }
        
        /* Bouton Google */
        .btn-google { width: 100%; padding: 1rem; background: #FFFFFF; color: #000000; border: none; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 1.5rem; transition: transform 0.3s; }
        .btn-google:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(255,255,255,0.2); }
        .btn-google i { font-size: 1.2rem; }
        
        /* Séparateur OU */
        .divider { display: flex; align-items: center; margin-bottom: 1.5rem; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .divider span { padding: 0 15px; }

        .form-group { margin-bottom: 1.5rem; position: relative; }
        .form-group label { display: block; margin-bottom: 0.5rem; color: var(--text-muted); font-size: 0.9rem; font-weight: 600; }
        .form-group input { width: 100%; padding: 1rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: white; font-family: inherit; font-size: 1rem; box-sizing: border-box; transition: all 0.3s; }
        .form-group input:focus { outline: none; border-color: var(--neon-lime); background: rgba(212, 255, 0, 0.05); }
        
        .toggle-password { position: absolute; right: 15px; top: 40px; color: var(--text-muted); cursor: pointer; font-size: 1.2rem; transition: color 0.3s; }
        .toggle-password:hover { color: var(--neon-lime); }
        
        .btn-submit { width: 100%; padding: 1.2rem; background: var(--neon-lime); color: var(--bg-dark); border: none; border-radius: 12px; font-weight: 800; font-size: 1.1rem; cursor: pointer; text-transform: uppercase; margin-top: 1rem; transition: transform 0.3s; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(212, 255, 0, 0.2); }
        
        .error-msg { color: var(--neon-pink); background: rgba(255,0,102,0.1); padding: 1rem; border-radius: 8px; margin-bottom: 1rem; display: none; font-size: 0.9rem; border: 1px solid rgba(255,0,102,0.3); }
        .success-msg { color: var(--neon-lime); background: rgba(212,255,0,0.1); padding: 1rem; border-radius: 8px; margin-bottom: 1rem; display: none; font-size: 0.9rem; border: 1px solid rgba(212,255,0,0.3); }
        .footer-link { text-align: center; margin-top: 2rem; color: var(--text-muted); font-size: 0.95rem; }
        .footer-link a { color: var(--neon-lime); text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="logo"><i class="fas fa-asterisk"></i> NOVA TEMPO</a>
    </nav>

    <div class="auth-container">
        <div class="bg-image"></div>
        <div class="auth-card">
            <h2>Créer un compte</h2>
            
            <div id="error-message" class="error-msg"></div>
            <div id="success-message" class="success-msg"></div>

            <!-- Bouton Google -->
            <button type="button" class="btn-google" id="google-btn">
                <i class="fab fa-google"></i> S'inscrire avec Google
            </button>
            
            <div class="divider"><span>ou avec votre email</span></div>

            <form id="signup-form">
                <div class="form-group">
                    <label>Adresse Email</label>
                    <input type="email" id="email" required placeholder="nom@exemple.com">
                </div>
                
                <div class="form-group">
                    <label>Mot de passe</label>
                    <input type="password" id="password" required minlength="6" placeholder="6 caractères minimum">
                    <i class="fas fa-eye toggle-password" id="eye-icon"></i>
                </div>
                
                <button type="submit" class="btn-submit" id="submit-btn">M'inscrire</button>
            </form>
            
            <div class="footer-link">
                Déjà un compte ? <a href="/login.html">Se connecter</a>
            </div>
        </div>
    </div>

    <script>
        // 1. GESTION DE L'OEIL
        const eyeIcon = document.getElementById('eye-icon');
        const passwordInput = document.getElementById('password');

        eyeIcon.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('fa-eye');
                eyeIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('fa-eye-slash');
                eyeIcon.classList.add('fa-eye');
            }
        });

        // 2. CONFIGURATION SUPABASE
        const supabaseUrl = 'https://wxkeuyyppzuqplnutwzk.supabase.co';
        const supabaseKey = 'sb_publishable_DrMH4qQCF4s1KyoPjvlJeA_puXHR_rr';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // 3. INSCRIPTION GOOGLE
        document.getElementById('google-btn').addEventListener('click', async () => {
            try {
                const { data, error } = await supabase.auth.signInWithOAuth({
                    provider: 'google',
                    options: {
                        redirectTo: window.location.origin + '/studio.html'
                    }
                });
                if (error) throw error;
            } catch (err) {
                alert('Erreur Google : ' + err.message);
            }
        });

        // 4. INSCRIPTION CLASSIQUE EMAIL/MDP
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault(); 

            const btn = document.getElementById('submit-btn');
            const errorDiv = document.getElementById('error-message');
            const successDiv = document.getElementById('success-message');
            
            btn.textContent = 'Création en cours...';
            btn.disabled = true;
            errorDiv.style.display = 'none';
            successDiv.style.display = 'none';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const { data, error } = await supabase.auth.signUp({
                    email: email,
                    password: password
                });

                if (error) throw error;

                // SUCCÈS
                successDiv.textContent = 'Compte créé avec succès ! Redirection...';
                successDiv.style.display = 'block';
                
                setTimeout(() => {
                    window.location.href = '/studio.html';
                }, 1500);
                
            } catch (err) {
                // ERREUR
                errorDiv.style.display = 'block';
                errorDiv.textContent = 'Erreur : ' + err.message;
                btn.textContent = 'M\'inscrire';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
