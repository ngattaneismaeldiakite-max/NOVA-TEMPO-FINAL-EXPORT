<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Nova Tempo</title>
    
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #FF3366;
            --bg-dark: #0A0A0A;
            --bg-card: #1A1A1A;
            --text: #FFFFFF;
            --text-muted: #888888;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-container {
            background: var(--bg-card);
            padding: 3rem;
            border-radius: 15px;
            width: 100%;
            max-width: 400px;
            border: 1px solid rgba(255,255,255,0.1);
            text-align: center;
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 2rem;
            background: linear-gradient(45deg, var(--primary), #FF8833);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* --- Bouton Google --- */
        .btn-google {
            width: 100%;
            padding: 1rem;
            background: white;
            color: #333;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            transition: 0.3s;
        }
        .btn-google:hover {
            background: #f0f0f0;
            transform: translateY(-2px);
        }

        .divider {
            text-align: center;
            margin-bottom: 1.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
            position: relative;
        }
        .divider::before, .divider::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 25%;
            height: 1px;
            background: rgba(255,255,255,0.1);
        }
        .divider::before { left: 0; }
        .divider::after { right: 0; }

        .form-group {
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        input {
            width: 100%;
            padding: 1rem;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: var(--text);
            font-family: inherit;
            box-sizing: border-box;
        }

        .btn-submit {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(45deg, var(--primary), #FF8833);
            border: none;
            border-radius: 8px;
            color: white;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .error-message {
            color: var(--primary);
            background: rgba(255,51,102,0.1);
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            display: none;
        }

        .links {
            margin-top: 1.5rem;
            color: var(--text-muted);
        }

        .links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo">NOVA TEMPO</div>
        <h2 style="margin-top:0; margin-bottom: 2rem;">Créer un compte</h2>

        <div id="errorBox" class="error-message"></div>

        <!-- Bouton Google -->
        <button id="googleBtn" type="button" class="btn-google">
            <i class="fab fa-google"></i> S'inscrire avec Google
        </button>

        <div class="divider">ou avec un email</div>

        <form id="signupForm">
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="password" required minlength="6">
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">Créer mon compte</button>
        </form>

        <div class="links">
            <p>Déjà un compte ? <a href="/login.html">Se connecter</a></p>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://wxkeuyyppzuqplnutwzk.supabase.co';
        const supabaseKey = 'sb_publishable_DrMH4qQCF4s1KyoPjvlJeA_puXHR_rr';
        window.supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('signupForm');
            const submitBtn = document.getElementById('submitBtn');
            const errorBox = document.getElementById('errorBox');
            const googleBtn = document.getElementById('googleBtn');

            function showError(message) {
                errorBox.textContent = message;
                errorBox.style.display = 'block';
            }

            googleBtn.addEventListener('click', async () => {
                try {
                    const { data, error } = await window.supabaseClient.auth.signInWithOAuth({
                        provider: 'google',
                        options: {
                            redirectTo: window.location.origin + '/studio.html'
                        }
                    });
                    if (error) throw error;
                } catch (error) {
                    showError("Erreur Google : " + error.message);
                }
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                try {
                    submitBtn.disabled = true;
                    submitBtn.textContent = 'Création...';
                    errorBox.style.display = 'none';

                    const { data, error } = await window.supabaseClient.auth.signUp({
                        email: email,
                        password: password,
                    });

                    if (error) throw error;
                    window.location.href = '/studio.html';

                } catch (error) {
                    let msg = error.message;
                    if (msg.includes("User already registered")) {
                        msg = "Cet email est déjà utilisé.";
                    }
                    showError(msg);
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Créer mon compte';
                }
            });
        });
    </script>
</body>
</html>
