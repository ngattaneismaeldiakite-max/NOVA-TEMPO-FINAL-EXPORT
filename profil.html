<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Profil - Nova Tempo</title>
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <!-- Script Supabase (Version Navigateur) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <style>
        :root {
            --bg-dark: #06060A; --card-bg: #111118;
            --text-light: #FFFFFF; --text-muted: rgba(255, 255, 255, 0.6);
            --neon-lime: #D4FF00; --neon-pink: #FF0066;
        }
        body { margin: 0; padding: 0; font-family: 'Satoshi', sans-serif; background-color: var(--bg-dark); color: var(--text-light); }
        
        nav { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 4rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .logo { font-size: 1.5rem; font-weight: 900; color: var(--text-light); text-decoration: none; }
        .logo i { color: var(--neon-lime); }
        
        .container { max-width: 1200px; margin: 4rem auto; padding: 0 2rem; }
        .header-profil { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 3rem; }
        .header-profil h1 { font-size: 3rem; margin: 0; font-weight: 900; text-transform: uppercase; }
        .header-profil p { color: var(--text-muted); margin: 0.5rem 0 0 0; font-size: 1.1rem; }
        
        .btn-logout { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: var(--text-light); padding: 0.8rem 1.5rem; border-radius: 50px; cursor: pointer; font-weight: 600; transition: all 0.3s; }
        .btn-logout:hover { border-color: var(--neon-pink); color: var(--neon-pink); }
        
        .dashboard-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 2rem; }
        
        .card { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; padding: 2rem; }
        .card h3 { margin-top: 0; color: var(--neon-lime); text-transform: uppercase; font-weight: 800; font-size: 1.2rem; }
        
        .btn-primary { display: inline-block; width: 100%; text-align: center; background: var(--neon-lime); color: var(--bg-dark); padding: 1rem; border-radius: 12px; font-weight: 800; text-decoration: none; margin-top: 1.5rem; transition: transform 0.3s; text-transform: uppercase; box-sizing: border-box; }
        .btn-primary:hover { transform: translateY(-2px); }
        
        .library-empty { text-align: center; color: var(--text-muted); padding: 3rem 0; }
        .library-empty i { font-size: 3rem; margin-bottom: 1rem; color: rgba(255,255,255,0.1); }
        
        @media (max-width: 768px) {
            nav { padding: 1.5rem 2rem; }
            .dashboard-grid { grid-template-columns: 1fr; }
            .header-profil { flex-direction: column; align-items: flex-start; gap: 1.5rem; }
        }
    </style>
</head>
<body>

    <nav>
        <a href="/" class="logo"><i class="fas fa-asterisk"></i> NOVA TEMPO</a>
        <button id="btn-logout" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Déconnexion</button>
    </nav>

    <div class="container" id="app-content" style="display: none;">
        <div class="header-profil">
            <div>
                <h1>Mon Espace</h1>
                <p id="user-email">Chargement...</p>
            </div>
            <a href="/studio.html" class="btn-primary" style="width: auto; margin: 0; padding: 1rem 2rem;">+ Créer une chanson</a>
        </div>

        <div class="dashboard-grid">
            <!-- Colonne Crédits / Solde -->
            <div class="card">
                <h3><i class="fas fa-wallet"></i> Mon Solde</h3>
                <h2 style="font-size: 2.5rem; margin: 1rem 0;">0 FCFA</h2>
                <p style="color: var(--text-muted); margin: 0; font-size: 0.9rem;">1 création = 1000 FCFA</p>
                <a href="#" class="btn-primary" style="background: transparent; border: 1px solid var(--neon-lime); color: var(--neon-lime);">Recharger mon compte</a>
            </div>

            <!-- Colonne Bibliothèque -->
            <div class="card">
                <h3><i class="fas fa-music"></i> Ma Bibliothèque</h3>
                <div id="library-content" class="library-empty">
                    <i class="fas fa-compact-disc"></i>
                    <p>Vous n'avez pas encore créé de musique.</p>
                    <p style="font-size: 0.9rem;">Vos futures créations apparaîtront ici.</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        // INITIALISATION SÉCURISÉE SUPABASE
        const supabaseUrl = 'https://wxkeuyyppzuqplnutwzk.supabase.co';
        const supabaseKey = 'sb_publishable_DrMH4qQCF4s1KyoPjvlJeA_puXHR_rr';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // VÉRIFICATION DE LA CONNEXION
        async function checkSession() {
            try {
                const { data, error } = await supabase.auth.getSession();
                
                // Si aucune session, on redirige vers la connexion
                if (error || !data.session) {
                    window.location.replace('/login.html');
                    return;
                }
                
                // Si connecté, on affiche l'email et on dévoile l'interface
                document.getElementById('user-email').textContent = data.session.user.email;
                document.getElementById('app-content').style.display = 'block';
                
            } catch (err) {
                console.error("Erreur de vérification de session :", err);
            }
        }

        // DÉCONNEXION
        document.getElementById('btn-logout').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.href = '/';
        });

        // Lancement au chargement de la page
        checkSession();
    </script>
</body>
</html>
