<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Bibliothèque - Nova Tempo</title>    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        :root {
            --primary-magenta: #0047AB;
            --primary-purple: #0047AB;
            --primary-yellow: #E60023;
            --white: #ffffff;
            --bg-light: #ffffff;
            --bg-gray: #f7f7f8;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --metallic-gradient: linear-gradient(135deg, #0047AB 0%, #E60023 100%);
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background-color: var(--bg-gray);
            display: flex;
            flex-direction: column; 
            height: 100vh;
            overflow-x: hidden;
            width: 100%;
        }

        .sidebar {
            width: 280px;
            height: 100vh;
            background: var(--white);
            border-right: 1px solid #eaeaea;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            z-index: 50;
        }
        
        .sidebar-header { padding: 25px; font-weight: 900; font-size: 20px; color: var(--primary-magenta); display: flex; align-items: center; gap: 10px; }
        
        .nav-menu { padding: 0 15px; display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .nav-item {
            display: flex; align-items: center; gap: 15px; padding: 14px 18px;
            border-radius: 12px; font-weight: 700; font-size: 15px; color: var(--text-muted);
            cursor: pointer; transition: all 0.3s; text-decoration: none;
        }
        .nav-item:hover { background: rgba(0, 71, 171, 0.05); color: var(--text-main); }
        .nav-item.active { background: var(--metallic-gradient); color: var(--white); box-shadow: 0 10px 20px rgba(0, 71, 171, 0.3); }

        .main-content { flex: 1; display: flex; flex-direction: column; background: var(--white); width: 100%; overflow-y: auto; }
        
        .top-header {
            padding: 20px 30px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #eaeaea; background: var(--white); z-index: 1; position: sticky; top: 0;
        }
        .top-header h1 { font-size: 24px; font-weight: 800; margin:0; }
        
        .workspace { padding: 30px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; background: var(--bg-gray); }
        .history-section { width: 100%; max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

        .track-card {
            background: white; border-radius: 18px; padding: 25px; border: 1px solid #eaeaea; text-align: left; box-shadow: 0 4px 15px rgba(0,0,0,0.02); transition: transform 0.2s, box-shadow 0.2s;
        }
        .track-card:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.05); }

        .btn-action-round {
            background: #f7f7f8; border: 1.5px solid #eaeaea; border-radius: 12px; width: 40px; height: 40px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; color: #0a0a0a; transition: all 0.2s;
        }
        .btn-action-round:hover { background: #0047AB; color: white; border-color: #0047AB; }

        @media (min-width: 768px) {
            body { flex-direction: row; overflow: hidden; }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="sidebar-header">
            ⚡ NOVA TEMPO
        </div>
        <nav class="nav-menu">
            <a href="studio.html" class="nav-item">
                <span>🎤</span> Studio Création
            </a>
            <a href="bibliotheque.html" class="nav-item active">
                <span>🎵</span> Ma Bibliothèque
            </a>
            <a href="recharge.html" class="nav-item">
                <span>💳</span> Recharger Crédits
            </a>
            <a href="profil.html" class="nav-item">
                <span>👤</span> Mon Profil
            </a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <h1>Ma Bibliothèque musicale</h1>
            <a href="studio.html" style="background: var(--metallic-gradient); color: white; padding: 10px 20px; border-radius: 12px; font-weight: bold; text-decoration: none;">+ Créer un morceau</a>
        </header>

        <div class="workspace">
            <div class="history-section" id="tracks-container">
                <div style="text-align: center; padding: 40px;">
                    <div style="color: var(--primary-magenta); font-weight: bold;">Chargement de vos créations...</div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="player.js"></script>
    <script src="track-actions.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('tracks-container');
            if (!container) return;

            let userId = null;
            if (window.supabaseClient) {
                try {
                    const { data: { user } } = await window.supabaseClient.auth.getUser();
                    if (user) userId = user.id;
                } catch(e) { console.error("Auth check:", e); }
            }

            let tracks = [];
            if (window.supabaseClient) {
                try {
                    let query = window.supabaseClient.from('songs').select('*').order('created_at', { ascending: false });
                    if (userId) query = query.eq('user_id', userId);
                    const { data, error } = await query;
                    if (!error && data) tracks = data;
                } catch(e) { console.error("Erreur fetch songs:", e); }
            }

            if (tracks.length === 0 && window.supabaseClient) {
                try {
                    const { data } = await window.supabaseClient.from('tracks').select('*').order('created_at', { ascending: false });
                    if (data) tracks = data;
                } catch(e) {}
            }

            if (!tracks || tracks.length === 0) {
                tracks = [
                    {
                        id: 'demo-1',
                        title: 'Mon Amour Éternel',
                        occasion: 'Amour',
                        style: 'Afro-Zouk Romantique',
                        url_audio: 'demo1.mp3',
                        cover_url: 'hero.jpg',
                        lyrics: '[Couplet 1]\nDepuis le premier jour où nos regards se sont croisés...\n\n[Refrain]\nMon amour pour toi brille comme une étoile...',
                        created_at: new Date().toISOString()
                    },
                    {
                        id: 'demo-2',
                        title: 'Joyeux Anniversaire Sarah',
                        occasion: 'Anniversaire',
                        style: 'Afrobeats Dynamique',
                        url_audio: 'demo2.mp3',
                        cover_url: 'anniversaire.jpg',
                        lyrics: '[Couplet 1]\nUne bougie de plus sur le gâteau aujourd’hui...\n\n[Refrain]\nCélébrons Sarah toute la nuit !',
                        created_at: new Date().toISOString()
                    }
                ];
            }

            let html = '';
            tracks.forEach(t => {
                const title = t.title || t.titre || 'Sans titre';
                const occasion = t.occasion || 'Spéciale';
                const style = t.style || t.style_musical || 'Afro-Pop';
                const audioUrl = t.url_audio || t.audio_url || 'demo1.mp3';
                const coverUrl = t.cover_url || t.image_url || 'hero.jpg';
                const lyrics = t.lyrics || t.paroles || 'Aucune parole disponible.';
                const dateStr = new Date(t.created_at || Date.now()).toLocaleDateString('fr-FR');

                html += `
                <div class="track-card">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; flex-wrap: wrap; gap: 10px;">
                        <div style="display: flex; align-items: center; gap: 15px;">
                            <img src="${coverUrl}" alt="Cover" style="width: 60px; height: 60px; border-radius: 12px; object-fit: cover;">
                            <div>
                                <h3 style="margin: 0 0 4px 0; font-size: 1.2rem; font-weight: 800; color: var(--text-main);">${title}</h3>
                                <div style="font-size: 13px; color: var(--text-muted); font-weight: 600;">Créé le ${dateStr}</div>
                            </div>
                        </div>
                        <div style="display: flex; gap: 8px;">
                            <span style="background: rgba(0,71,171,0.1); color: var(--primary-magenta); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight:bold;">${style}</span>
                            <span style="background: rgba(230,0,35,0.1); color: var(--primary-yellow); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight:bold;">${occasion}</span>
                        </div>
                    </div>

                    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 15px; pt-15px; border-top: 1px solid #eaeaea;">
                        <button type="button" onclick="playTrack('${title.replace(/'/g, "\\'")}', '${occasion}', '${coverUrl}', '${audioUrl}')" style="background: var(--metallic-gradient); color: white; border: none; padding: 10px 20px; border-radius: 12px; font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                            ▶ Écouter
                        </button>
                        <div style="display: flex; gap: 10px;">
                            <button type="button" class="btn-action-round" title="Partager" data-track-title="${title}" data-audio-url="${audioUrl}">🔗</button>
                            <button type="button" class="btn-action-round" title="Télécharger MP3 HQ" data-track-title="${title}" data-audio-url="${audioUrl}">⬇️</button>
                        </div>
                    </div>

                    <details style="margin-top: 15px; cursor: pointer;">
                        <summary style="color: var(--primary-magenta); font-size: 14px; font-weight: bold; outline: none;">Afficher les paroles</summary>
                        <p style="color: var(--text-main); font-size: 14px; white-space: pre-wrap; margin-top: 12px; background: #f7f7f8; padding: 18px; border-radius: 12px; border-left: 4px solid var(--primary-magenta); line-height: 1.6;">${lyrics}</p>
                    </details>
                </div>
                `;
            });

            container.innerHTML = html;
        });
    </script>
</body>
</html>
