<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Bibliothèque - Nova Tempo</title>    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');

        :root {
            --primary-magenta: #0047AB;
            --primary-purple: #0047AB;
            --primary-yellow: #E60023;
            --white: #ffffff;
            --bg-light: #ffffff;
            --bg-gray: #f7f7f8;
            --bg-glass: rgba(255, 255, 255, 0.85);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --metallic-gradient: #E60023;
        }

        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background-color: var(--bg-gray);
            display: flex;
            flex-direction: column; 
            height: 100vh;
            overflow-x: hidden;
            width: 100%;
            max-width: 100vw;
        }

        .sidebar {
            position: fixed;
            left: -300px;
            top: 0;
            width: 280px;
            height: 100vh;
            background: var(--white);
            border-right: 1px solid #eaeaea;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            z-index: 50;
            transition: left 0.3s ease;
        }
        .sidebar.mobile-active { left: 0; }
        
        .sidebar-header { padding: 20px; display: flex; align-items: center; gap: 15px; justify-content: center; }
        
        .nav-menu { padding: 0 15px; display: flex; flex-direction: column; gap: 5px; margin-top: 10px; }
        .nav-item {
            display: flex; align-items: center; gap: 15px; padding: 12px 15px;
            border-radius: 12px; font-weight: 700; font-size: 15px; color: var(--text-muted);
            cursor: pointer; transition: all 0.3s;
            text-decoration: none;
        }
        .nav-item:hover { background: rgba(0, 71, 171, 0.05); }
        .nav-item.active { background: var(--metallic-gradient); color: var(--white); box-shadow: 0 10px 20px rgba(0, 71, 171, 0.2); }

        .main-content { flex: 1; display: flex; flex-direction: column; background: var(--white); width: 100%; }
        
        .top-header {
            padding: 15px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid #eaeaea; background: var(--white); z-index: 1;
            flex-wrap: wrap; gap: 10px;
        }
        .top-header h1 { font-size: 20px; font-weight: 800; margin:0; }
        .mobile-menu-btn { display: block; background: none; border: none; font-size: 24px; cursor: pointer; padding: 5px; margin-right: 10px;}
        
        .workspace { padding: 15px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; background: var(--bg-gray); }
        .history-section { width: 100%; max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 15px; }
        
        .mobile-overlay { display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.5); z-index: 40; }
        .mobile-overlay.active { display: block; }

        @media (min-width: 768px) {
            body { flex-direction: row; overflow: hidden; }
            .sidebar { position: static; left: 0; height: 100vh; width: 240px; z-index: 10; }
            .mobile-menu-btn { display: none; }
            .mobile-overlay { display: none !important; }
            .top-header { padding: 20px 30px; }
            .top-header h1 { font-size: 24px; }
            .workspace { padding: 30px; }
        }

        @media (min-width: 1024px) {
            .sidebar { width: 280px; }
            .sidebar-header { padding: 30px; }
            .top-header { padding: 20px 40px; }
            .workspace { padding: 40px; }
        }
    </style>
    <!-- SEO & Favicon -->
    <link rel="icon" type="image/png" href="logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="mobile-overlay" id="mobile-overlay" onclick="toggleMobileMenu()"></div>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header" style="justify-content: center; padding: 20px 0;">
            <img src="logo.png" alt="Logo" style="background: rgba(255,255,255,0.95); padding: 8px 12px; border-radius: 12px; height: 35px; width: auto; margin-right: 10px;">
        </div>
        
        <nav class="nav-menu">
            <a href="index.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg> Accueil
            </a>
            <a href="studio.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg> Studio Création
            </a>
            <a href="bibliotheque.html" class="nav-item active">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"></polygon><polyline points="2 17 12 22 22 17"></polyline><polyline points="2 12 12 17 22 12"></polyline></svg> 🎧 Mes Sons
            </a>
            <a href="parametres.html" class="nav-item">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg> Paramètres
            </a>
        </nav>
        
        <div style="flex: 1;"></div>
        
        <div class="user-profile" style="position: relative; cursor:pointer; background: #f9f9f9; border-radius: 16px; padding: 12px; display: flex; align-items: center; gap: 12px; margin: 20px; border: 1px solid #eaeaea;" onclick="if(typeof toggleProfileMenu === 'function') toggleProfileMenu(event)">
            <div class="display-avatar" style="width:36px; height:36px; border-radius:50%; background: var(--metallic-gradient); display: flex; align-items: center; justify-content: center; color: white; flex-shrink:0;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </div>
            <div style="display:flex; flex-direction:column; justify-content:center;">
                <strong class="display-username" style="font-family: 'Inter', sans-serif; font-size: 16px; color:var(--text-main);">Utilisateur</strong>
                <span style="font-size: 11px; color: var(--text-muted); margin-top: 2px;">Mon Compte</span>
            </div>
            
            <div id="profile-dropdown" style="display: none; position: absolute; bottom: 75px; left: 0; width: 100%; background: white; border: 1px solid #eaeaea; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); flex-direction: column; overflow: hidden; z-index: 100;">
                <a href="parametres.html" style="padding: 12px 15px; text-decoration: none; font-size: 16px; font-weight: 600; border-bottom: 1px solid #eaeaea; transition: background 0.2s;" onmouseover="this.style.background='#f7f7f8'" onmouseout="this.style.background='white'">⚙️ Paramètres</a>
                <a href="index.html" onclick="localStorage.removeItem('nova_username');" style="padding: 12px 15px; text-decoration: none; color: #d93025; font-size: 16px; font-weight: 600; transition: background 0.2s;" onmouseover="this.style.background='#fcf0f0'" onmouseout="this.style.background='white'">👋 Se déconnecter</a>
            </div>
        </div>
    </aside>

    <script>
    function toggleProfileMenu(e) {
        e.stopPropagation();
        const dropdown = document.getElementById('profile-dropdown');
        dropdown.style.display = dropdown.style.display === 'none' || dropdown.style.display === '' ? 'flex' : 'none';
    }
    document.addEventListener('click', function(e) {
        const dropdown = document.getElementById('profile-dropdown');
        if (dropdown && dropdown.style.display === 'flex' && !e.target.closest('.user-profile')) {
            dropdown.style.display = 'none';
        }
    });
    </script>

    <main class="main-content">
        <header class="top-header">
            <div style="display:flex; align-items:center;">
                <button class="mobile-menu-btn" onclick="toggleMobileMenu()">☰</button>
                <h1 style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 900;">🎧 Mes Sons</h1>
            </div>
        </header>

        <div class="workspace">
            <div class="history-section" id="library-container">
                <!-- Les musiques seront injectées ici par JavaScript / Supabase -->
            </div>
        </div>
    </main>

    <!-- Inclusion de Supabase -->
    <script src="supabase-client.js" defer></script>
    
    <script>
        // Init User Interface
        const storedUsername = localStorage.getItem('nova_username') || 'Utilisateur';
        document.querySelector('.display-username').textContent = storedUsername;

        // Mobile Menu
        function toggleMobileMenu() {
            document.getElementById('sidebar').classList.toggle('mobile-active');
            document.getElementById('mobile-overlay').classList.toggle('active');
        }

        async function renderLibrary() {
            const container = document.getElementById('library-container');
            container.innerHTML = '<p style="text-align:center; padding: 50px; color: var(--text-muted); font-weight: bold;">Chargement de vos hits... 🎵</p>';

            if (!window.supabaseClient) {
                container.innerHTML = '<p style="color:red; text-align:center;">Erreur: Base de données non connectée.</p>';
                return;
            }

            // 1. Vérifier la session
            const { data: { session } } = await window.supabaseClient.auth.getSession();
            if (!session) {
                // Si non connecté, on le renvoie au login pour protéger la page
                window.location.href = 'login.html';
                return;
            }

            // 2. Récupérer les musiques (seulement celles de cet utilisateur grâce au RLS)
            const { data: tracks, error } = await window.supabaseClient
                .from('tracks')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error("Erreur:", error);
                container.innerHTML = '<p style="color:red; text-align:center;">Erreur lors du chargement de la bibliothèque.</p>';
                return;
            }

            // 3. GESTION DE L'ÉTAT VIDE
            if (!tracks || tracks.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 60px 20px; background: white; border: 2px dashed #eaeaea; border-radius: 16px;">
                        <div style="font-size: 48px; margin-bottom: 15px;">🎧</div>
                        <h3 style="color: var(--text-main); margin-bottom: 15px; font-weight: 800;">Tu n'as pas encore créé de son</h3>
                        <p style="color: var(--text-muted); margin-bottom: 25px;">La magie n'attend que toi. Transforme tes mots en musique en quelques clics !</p>
                        <button onclick="window.location.href='studio.html'" style="background: var(--metallic-gradient); color: white; padding: 12px 25px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px;">Aller au Studio Création</button>
                    </div>
                `;
                return;
            }

            // 4. AFFICHAGE DES MUSIQUES
            let html = '';
            tracks.forEach(t => {
                const dateFormatee = new Date(t.created_at).toLocaleDateString('fr-FR');
                html += `
                <div class="track-card" style="background: white; border-radius: 16px; padding: 25px; margin-bottom: 20px; border: 1px solid #eaeaea; text-align: left; box-shadow: 0 4px 15px rgba(0,0,0,0.02); display: flex; flex-direction: column; width: 100%;">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; width: 100%; flex-wrap: wrap; gap: 10px;">
                        <div>
                            <h3 style="color: var(--text-main); margin: 0 0 5px 0; font-size: 1.3rem; font-weight: 800;">${t.titre}</h3>
                            <div style="font-size: 13px; color: var(--text-muted); font-weight: 600;">Créé le ${dateFormatee}</div>
                        </div>
                        <div style="display: flex; gap: 8px;">
                            <span style="background: rgba(0,71,171,0.1); color: var(--primary-magenta); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight:bold;">${t.style_musical || 'Standard'}</span>
                            <span style="background: rgba(230,0,35,0.1); color: var(--primary-yellow); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight:bold;">${t.occasion || 'Libre'}</span>
                        </div>
                    </div>
                    <audio src="${t.url_audio}" controls style="width: 100%; border-radius: 8px; outline: none;"></audio>
                    
                    <details style="margin-top: 20px; cursor: pointer;">
                        <summary style="color: var(--primary-magenta); font-size: 15px; font-weight: bold; outline: none;">Lire les paroles</summary>
                        <p style="color: var(--text-main); font-size: 14px; white-space: pre-wrap; margin-top: 15px; background: #f7f7f8; padding: 20px; border-radius: 12px; border-left: 4px solid var(--primary-magenta); line-height: 1.6;">${t.paroles || 'Pas de paroles pour cette création.'}</p>
                    </details>
                </div>
                `;
            });
            
            container.innerHTML = html;
        }
        
        // Exécuter l'affichage (avec un petit délai pour être sûr que Supabase est chargé)
        setTimeout(renderLibrary, 500);
    </script>
</body>
</html>
