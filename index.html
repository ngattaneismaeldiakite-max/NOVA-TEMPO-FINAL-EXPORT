<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Tempo - Composez vos émotions</title>
    
    <!-- Polices et Icones -->
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap" rel="stylesheet">
    <link href="https://api.fontshare.com/v2/css?f[]=instrument-serif@400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* THEME DARK NEON */
        :root {
            --bg-dark: #06060A;
            --card-bg: #111118;
            --text-light: #FFFFFF;
            --text-muted: rgba(255, 255, 255, 0.6);
            --neon-lime: #D4FF00;
            --neon-pink: #FF0066;
        }

        body { margin: 0; padding: 0; font-family: 'Satoshi', sans-serif; background-color: var(--bg-dark); color: var(--text-light); overflow-x: hidden; }

        /* NAVIGATION */
        nav { display: flex; justify-content: space-between; align-items: center; padding: 1.5rem 4rem; position: absolute; top: 0; left: 0; right: 0; z-index: 100; }
        .logo { font-size: 1.5rem; font-weight: 900; color: var(--text-light); text-decoration: none; letter-spacing: -0.02em; display: flex; align-items: center; gap: 0.5rem; }
        .logo i { color: var(--neon-lime); }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-links a { color: var(--text-light); text-decoration: none; font-weight: 600; font-size: 0.95rem; transition: color 0.3s; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .nav-links a:hover { color: var(--neon-lime); }
        .auth-buttons a { padding: 0.7rem 1.5rem; border-radius: 50px; font-weight: 700; font-size: 0.95rem; text-decoration: none; transition: all 0.3s; }
        .btn-login { color: var(--text-light); margin-right: 1rem; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        .btn-login:hover { color: var(--neon-lime); }
        .btn-signup { background-color: var(--neon-lime); color: var(--bg-dark); box-shadow: 0 0 15px rgba(212, 255, 0, 0.2); }
        .btn-signup:hover { transform: translateY(-2px); box-shadow: 0 0 25px rgba(212, 255, 0, 0.4); }

        /* HERO SECTION */
        .hero { min-height: 100vh; display: flex; align-items: center; padding: 0 4rem; position: relative; overflow: hidden; }
        .hero-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: url('fille-casque.jpg'); background-size: cover; background-position: center; filter: blur(3px) brightness(0.9); transform: scale(1.02); z-index: 0; }
        .hero-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(90deg, #06060A 0%, rgba(6,6,10,0.85) 45%, rgba(6,6,10,0.2) 100%); z-index: 1; }
        .hero-content { display: block; width: 100%; max-width: 1400px; margin: 0 auto; margin-bottom: 15rem; position: relative; z-index: 2; }
        .hero-text { max-width: 700px; }
        .hero-text h1 { font-size: 5rem; font-weight: 900; line-height: 1.1; margin-bottom: 1.5rem; letter-spacing: -0.03em; text-transform: uppercase; text-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        .hero-text h1 span { font-family: 'Instrument Serif', serif; font-style: italic; color: var(--neon-lime); text-transform: lowercase; font-weight: 400; font-size: 5.5rem; }
        .hero-text p { font-size: 1.25rem; color: rgba(255,255,255,0.9); margin-bottom: 0; max-width: 550px; line-height: 1.6; text-shadow: 0 4px 15px rgba(0,0,0,0.8); }

        /* VINYLS SHOWCASE */
        .vinyl-showcase { position: absolute; bottom: 2rem; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; flex-direction: column; align-items: center; width: 100%; }
        .vinyl-text-new { color: var(--text-light); font-size: 2.5rem; font-family: 'Instrument Serif', serif; font-style: italic; text-align: center; margin-bottom: 1.5rem; text-shadow: 0 4px 15px rgba(0,0,0,0.8); }
        .vinyl-text-new span { color: var(--neon-lime); font-family: 'Satoshi', sans-serif; font-weight: 900; font-style: normal; font-size: 1.8rem; text-transform: uppercase; display: inline-block; margin-left: 8px; }
        .vinyl-container { display: flex; gap: 2.5rem; align-items: center; }
        .vinyl { width: 200px; height: 200px; border-radius: 50%; background-color: #1a1a1a; background-size: cover; background-position: center; border: 2px solid rgba(255,255,255,0.2); display: flex; justify-content: center; align-items: center; position: relative; animation: spin 5s linear infinite; box-shadow: 0 15px 40px rgba(0,0,0,0.9); cursor: pointer; transition: all 0.3s; overflow: hidden; }
        .vinyl.middle { width: 250px; height: 250px; }
        .vinyl::after { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.4); border-radius: 50%; z-index: 0; transition: background 0.3s; }
        .vinyl:hover::after { background: rgba(0,0,0,0.2); }
        .vinyl:hover { border-color: var(--neon-lime); transform: scale(1.05); }
        .vinyl.playing { border-color: var(--neon-lime); box-shadow: 0 0 45px rgba(212, 255, 0, 0.6); animation: spin 2.5s linear infinite; }
        .vinyl::before { content: ''; position: absolute; width: 45px; height: 45px; background: var(--neon-lime); border-radius: 50%; z-index: 1; transition: background 0.3s; box-shadow: 0 0 10px rgba(0,0,0,0.5); }
        .vinyl.playing::before { background: var(--neon-pink); }
        .vinyl i { color: #000; z-index: 2; font-size: 1.5rem; margin-left: 3px; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* SECTION OCCASIONS */
        .occasions-section { padding: 6rem 4rem; background: var(--bg-dark); max-width: 1400px; margin: 0 auto; position: relative; z-index: 2; }
        .section-title { font-size: 3rem; font-weight: 900; text-align: center; margin-bottom: 1rem; text-transform: uppercase; }
        .section-subtitle { text-align: center; color: var(--text-muted); font-size: 1.2rem; margin-bottom: 4rem; }
        .occ-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 2rem; }
        .occ-card { width: 100%; max-width: 320px; height: 280px; position: relative; border-radius: 20px; overflow: hidden; text-decoration: none; border: 1px solid rgba(255,255,255,0.05); transition: all 0.4s ease; }
        .occ-card:hover { transform: translateY(-10px); border-color: var(--neon-lime); box-shadow: 0 15px 30px rgba(212, 255, 0, 0.15); }
        .occ-card img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .occ-card:hover img { transform: scale(1.05); }
        .occ-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(6,6,10,0.9) 0%, rgba(6,6,10,0.1) 100%); display: flex; align-items: flex-end; padding: 2rem; }
        .occ-overlay h3 { margin: 0; color: var(--text-light); font-size: 1.5rem; font-weight: 800; text-transform: uppercase; }

        /* MODALS */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(10px); display: flex; justify-content: center; align-items: center; opacity: 0; visibility: hidden; transition: all 0.3s; z-index: 1000; }
        .modal:target { opacity: 1; visibility: visible; }
        
        /* Pour que la FAQ puisse défiler si elle est longue */
        .modal-content { background: var(--card-bg); padding: 3rem; border-radius: 24px; width: 90%; max-width: 650px; position: relative; border: 1px solid rgba(255,255,255,0.1); max-height: 85vh; overflow-y: auto; }
        
        .modal-close { position: absolute; top: 1.5rem; right: 1.5rem; color: var(--text-muted); text-decoration: none; font-size: 1.5rem; }
        .modal-close:hover { color: var(--neon-lime); }
        .modal h2 { margin-top: 0; color: var(--neon-lime); text-transform: uppercase; font-size: 2rem; margin-bottom: 1.5rem; }

        /* STYLE ACCORDEON FAQ */
        .faq-category { color: var(--neon-lime); font-size: 1.1rem; margin-top: 2rem; margin-bottom: 1rem; text-transform: uppercase; font-weight: 900; }
        .faq-category:first-of-type { margin-top: 0; }
        .faq-category i { margin-right: 8px; }
        
        details { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; margin-bottom: 0.8rem; overflow: hidden; transition: all 0.3s; }
        details:hover { border-color: rgba(212, 255, 0, 0.3); background: rgba(255,255,255,0.05); }
        summary { padding: 1.2rem; font-weight: 700; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; color: var(--text-light); }
        summary::-webkit-details-marker { display: none; }
        summary::after { content: '\f078'; font-family: 'Font Awesome 6 Free'; font-weight: 900; color: var(--neon-lime); transition: transform 0.3s; }
        details[open] summary::after { transform: rotate(180deg); }
        .faq-answer { padding: 0 1.2rem 1.2rem 1.2rem; color: var(--text-muted); line-height: 1.6; font-size: 0.95rem; }

        /* RESPONSIVE DESIGN */
        @media (max-width: 1100px) {
            .hero { padding: 0 2rem; }
            .hero-overlay { background: linear-gradient(180deg, rgba(6,6,10,0.6) 0%, #06060A 100%); }
            .hero-content { margin-bottom: 16rem; text-align: center; } 
            .hero-text h1 { font-size: 3.5rem; }
            .hero-text h1 span { font-size: 4rem; }
            nav { padding: 1.5rem 2rem; flex-direction: column; gap: 1.5rem; background: rgba(6,6,10,0.95); }
            .occasions-section { padding: 4rem 2rem; }
            .vinyl-container { gap: 1.5rem; }
            .vinyl { width: 110px; height: 110px; }
            .vinyl.middle { width: 140px; height: 140px;
