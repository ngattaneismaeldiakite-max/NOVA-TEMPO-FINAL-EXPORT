<!DOCTYPE html>
<html lang="fr">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

    <title>Activation E-mail Support</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f5f5f5; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; max-width: 400px; }
        button { background: #E60023; color: white; border: none; padding: 15px 30px; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 20px; }
        body { overflow-x: hidden; width: 100%; max-width: 100vw; }
</style>
    <!-- SEO & Favicon -->
    <link rel="icon" type="image/png" href="logo.png">
    <meta name="description" content="Nova Tempo - L'intelligence artificielle qui transforme vos mots en chansons magiques. Créez des émotions musicales uniques en quelques secondes.">
    <meta name="theme-color" content="#0047AB">
    <meta property="og:title" content="Nova Tempo - Créez votre musique IA">
    <meta property="og:description" content="Transforme tes mots en chansons magiques avec Nova Tempo. Facile, rapide et super fun !">
    <meta property="og:image" content="hero.jpg">
</head>
<body>
    <div class="card">
        <h2>Étape d'activation requise ⚠️</h2>
        <p>Pour que la bulle de support puisse vous envoyer des messages masqués en arrière-plan (AJAX), le système de relais doit d'abord vérifier que cet e-mail vous appartient.</p>
        <p>Cliquez sur le bouton ci-dessous. Vous serez redirigé, et <strong>un e-mail d'activation vous sera envoyé</strong>.</p>
        
        <form action="https://formsubmit.co/ngattaneismaeldiakite@gmail.com" method="POST">
            <input type="hidden" name="_subject" value="Activation du Support Nova Tempo">
            <input type="hidden" name="Message" value="Ceci est un message de test pour activer le système.">
            <button type="submit">Envoyer le test d'activation</button>
        </form>
    </div>

<script>
if (typeof toggleProfileMenu !== "function") {
    window.toggleProfileMenu = function(e) {
        e.stopPropagation();
        const dropdown = document.getElementById("profile-dropdown");
        if(dropdown) {
            dropdown.style.display = dropdown.style.display === "none" || dropdown.style.display === "" ? "flex" : "none";
        }
    };
    document.addEventListener("click", function(e) {
        const dropdown = document.getElementById("profile-dropdown");
        if (dropdown && dropdown.style.display === "flex" && !e.target.closest(".user-profile")) {
            dropdown.style.display = "none";
        }
    });
}
</script>
</body>
</html>
