<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Nova Tempo</title>
    
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js" integrity="sha384-Rj26LVGvoeRVR6+mwQmFfcR3QOBEwT+ZmuCWpuiqeTzJpCs0ER4ITAWGb4Hiy3Ok" crossorigin="anonymous"></script>
    <script src="assets/js/supabase-client.js"></script>
    <script src="assets/js/auth-messages.js"></script>

    <style>
        :root {
            --bg-dark: #06060A; --card-bg: #111118;
            --text-light: #FFFFFF; --text-muted: rgba(255, 255, 255, 0.6);
            --neon-lime: #D4FF00; --neon-pink: #FF0066;
        }
        body { margin: 0; padding: 0; font-family: 'Satoshi', sans-serif; background-color: var(--bg-dark); color: var(--text-light); min-height: 100vh; display: flex; flex-direction: column; }
        
        nav { padding: 1.5rem 4rem; position: absolute; width: 100%; box-sizing: border-box; z-index: 10; }
        
        .auth-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 2rem; position: relative; }
        
        .bg-image { position: absolute; inset: 0; background-image: url('assets/images/fille-casque.jpg'); background-size: cover; background-position: center; opacity: 0.3; filter: blur(5px); z-index: 0; }
        
        .auth-card { background: rgba(17, 17, 24, 0.85); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; padding: 3rem; width: 100%; max-width: 450px; z-index: 1; box-shadow: 0 25px 50px rgba(0,0,0,0.5); }
        .auth-card h2 { font-size: 2rem; text-transform: uppercase; margin-top: 0; margin-bottom: 2rem; text-align: center; color: var(--neon-lime); }
        
        .btn-google { width: 100%; padding: 1rem; background: #FFFFFF; color: #000000; border: none; border-radius: 12px; font-weight: 700; font-size: 1rem; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 1.5rem; transition: transform 0.3s; }
        .btn-google:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(255,255,255,0.2); }
        .btn-google i { font-size: 1.2rem; }
        
        .divider { display: flex; align-items: center; margin-bottom: 1.5rem; color: var(--text-muted); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .divider span { padding: 0 10px; }
        
        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: var(--text-muted); }
        .form-group input { width: 100%; padding: 1rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; color: #fff; font-family: inherit; font-size: 1rem; box-sizing: border-box; outline: none; transition: border-color 0.3s; }
        .form-group input:focus { border-color: var(--neon-lime); }
        
        .btn-submit { width: 100%; padding: 1rem; background: var(--neon-lime); color: var(--bg-dark); border: none; border-radius: 12px; font-weight: 800; font-size: 1rem; cursor: pointer; text-transform: uppercase; margin-top: 1rem; transition: all 0.3s; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(212, 255, 0, 0.4); }
        
        .auth-footer { text-align: center; margin-top: 2rem; color: var(--text-muted); font-size: 0.9rem; }
        .auth-footer a { color: var(--neon-lime); text-decoration: none; font-weight: 700; }
        .auth-footer a:hover { text-decoration: underline; }
        
        #error-msg { background: rgba(255, 0, 102, 0.2); border: 1px solid var(--neon-pink); color: #fff; padding: 0.8rem; border-radius: 8px; font-size: 0.9rem; margin-bottom: 1rem; display: none; text-align: center; }
        #error-msg a, .info-msg a { color: var(--neon-lime); font-weight: 700; cursor: pointer; text-decoration: underline; }
        .info-msg { background: rgba(212, 255, 0, 0.08); border: 1px solid rgba(212, 255, 0, 0.45); color: #fff; padding: 0.9rem; border-radius: 8px; font-size: 0.9rem; line-height: 1.5; margin-bottom: 1rem; display: none; text-align: center; }

        .forgot-link { display: block; margin: -0.4rem 0 0.4rem auto; width: fit-content; background: none; border: none; padding: 0; color: var(--text-muted); font-family: inherit; font-size: 0.85rem; font-weight: 600; cursor: pointer; transition: color 0.2s; }
        .forgot-link:hover { color: var(--neon-lime); }
        .auth-sub { text-align: center; color: var(--text-muted); font-size: 0.95rem; line-height: 1.5; margin: -1rem 0 1.8rem; }
        .btn-back { display: block; margin: 1.4rem auto 0; background: none; border: none; color: var(--text-muted); font-family: inherit; font-size: 0.9rem; cursor: pointer; }
        .btn-back:hover { color: var(--neon-lime); }
        .btn-submit:disabled { opacity: 0.6; cursor: wait; transform: none; box-shadow: none; }
        #view-forgot { display: none; }

        @media (max-width: 600px) {
            nav { padding: 1rem; display: flex; justify-content: center; }
            .auth-container { padding: 5.5rem 1rem 2rem; }
            .auth-card { padding: 2rem 1.4rem; }
        }
    
        /* --- Finitions responsive --- */
        .forgot-link { display: inline-flex; align-items: center; min-height: 44px; padding: 0 0.2rem; }
        .btn-back { min-height: 44px; }
        .auth-footer a { display: inline-flex; align-items: center; min-height: 44px; }
    </style>
    <link rel="stylesheet" href="assets/css/logo.css">
</head>
<body>

    <nav>
        <a href="index.html" class="nova-brand-logo" aria-label="Nova Tempo - Accueil">
            <div class="logo-eq-bars" aria-hidden="true">
                <span class="eq-bar bar-1"></span>
                <span class="eq-bar bar-2"></span>
                <span class="eq-bar bar-3"></span>
                <span class="eq-bar bar-4"></span>
            </div>
            <img src="assets/images/logo-nova-tempo.png" alt="Nova Tempo" class="nova-brand-img">
        </a>
    </nav>

    <div class="auth-container">
        <div class="bg-image"></div>
        <div class="auth-card">
            <!-- Vue : connexion -->
            <div id="view-login">
                <h2>Bon retour !</h2>

                <div id="error-msg" role="alert"></div>
                <div id="login-info" class="info-msg" role="status"></div>

                <button type="button" class="btn-google" onclick="loginWithGoogle()">
                    <i class="fab fa-google"></i> Continuer avec Google
                </button>

                <div class="divider"><span>ou avec votre email</span></div>

                <form id="login-form" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="email">Adresse Email</label>
                        <input type="email" id="email" required autocomplete="email" placeholder="nom@exemple.com">
                    </div>
                    <div class="form-group">
                        <label for="password">Mot de passe</label>
                        <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
                    </div>
                    <button type="button" class="forgot-link" onclick="afficherVue('forgot')">Mot de passe oublié ?</button>
                    <button type="submit" class="btn-submit" id="submit-btn">Se connecter</button>
                </form>

                <div class="auth-footer">
                    Vous n'avez pas de compte ? <a href="signup.html">Créer un compte</a>
                </div>
            </div>

            <!-- Vue : mot de passe oublié -->
            <div id="view-forgot">
                <h2>Mot de passe oublié</h2>
                <p class="auth-sub">Indique l'e-mail de ton compte : on t'envoie un lien pour choisir un nouveau mot de passe.</p>

                <div id="forgot-error" class="info-msg" role="alert" style="background: rgba(255,0,102,0.2); border-color: var(--neon-pink);"></div>
                <div id="forgot-info" class="info-msg" role="status"></div>

                <form id="forgot-form" onsubmit="envoyerLienReset(event)">
                    <div class="form-group">
                        <label for="forgot-email">Adresse Email</label>
                        <input type="email" id="forgot-email" required autocomplete="email" placeholder="nom@exemple.com">
                    </div>
                    <button type="submit" class="btn-submit" id="forgot-btn">Recevoir le lien</button>
                </form>

                <button type="button" class="btn-back" onclick="afficherVue('login')"><i class="fas fa-arrow-left"></i> Retour à la connexion</button>
                <p class="auth-sub" style="margin: 1.2rem 0 0; font-size: 0.82rem;">Tu t'étais inscrit avec Google ? Pas besoin de mot de passe : utilise simplement « Continuer avec Google ».</p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            if (window.supabaseClient) {
                const { data: { session } } = await window.supabaseClient.auth.getSession();
                if (session) {
                    window.location.href = 'studio.html';
                }
            }
        });

        // Affiche un message ; `lien` = { texte, action } optionnel, ajouté à la suite
        function afficherMessage(id, texte, lien) {
            const el = document.getElementById(id);
            el.textContent = texte;
            if (lien) {
                const a = document.createElement('a');
                a.textContent = lien.texte;
                a.onclick = lien.action;
                el.append(' ', a);
            }
            el.style.display = 'block';
        }

        function masquerMessages() {
            ['error-msg', 'login-info', 'forgot-error', 'forgot-info'].forEach(id => {
                document.getElementById(id).style.display = 'none';
            });
        }

        function afficherVue(vue) {
            masquerMessages();
            document.getElementById('view-login').style.display = vue === 'login' ? 'block' : 'none';
            document.getElementById('view-forgot').style.display = vue === 'forgot' ? 'block' : 'none';
            if (vue === 'forgot') {
                const champ = document.getElementById('forgot-email');
                champ.value = champ.value || document.getElementById('email').value;
                champ.focus();
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submit-btn');

            btn.disabled = true;
            btn.textContent = "Connexion en cours...";
            masquerMessages();

            try {
                const { error } = await window.supabaseClient.auth.signInWithPassword({ email, password });
                if (error) throw error;
                window.location.href = 'studio.html';
            } catch (err) {
                const oubli = novaAuthCode(err) === 'invalid_credentials'
                    ? { texte: 'Mot de passe oublié ?', action: () => afficherVue('forgot') }
                    : null;
                afficherMessage('error-msg', novaAuthMessage(err), oubli);
                btn.disabled = false;
                btn.textContent = "Se connecter";
            }
        }

        async function envoyerLienReset(e) {
            e.preventDefault();
            const email = document.getElementById('forgot-email').value.trim();
            const btn = document.getElementById('forgot-btn');
            btn.disabled = true;
            btn.textContent = "Envoi en cours...";
            masquerMessages();

            const { error } = await window.supabaseClient.auth.resetPasswordForEmail(email, {
                redirectTo: window.location.origin + '/reset-password.html'
            });

            btn.disabled = false;
            btn.textContent = "Recevoir le lien";
            if (error) {
                afficherMessage('forgot-error', novaAuthMessage(error));
                return;
            }
            // Message identique que le compte existe ou non (on ne révèle pas quels e-mails sont inscrits)
            afficherMessage('forgot-info', `C'est envoyé ! Si un compte existe avec ${email}, tu vas recevoir un e-mail avec un lien pour choisir un nouveau mot de passe. Pense à regarder dans tes spams.`);
        }

        async function loginWithGoogle() {
            masquerMessages();
            try {
                const redirectTarget = window.location.origin + '/studio.html';
                const { error } = await window.supabaseClient.auth.signInWithOAuth({
                    provider: 'google',
                    // Toujours proposer le choix du compte Google
                    options: { redirectTo: redirectTarget, queryParams: { prompt: 'select_account' } }
                });
                if (error) throw error;
            } catch (err) {
                afficherMessage('error-msg', "La connexion Google n'a pas pu démarrer. " + novaAuthMessage(err));
            }
        }

        // Retour depuis la page de nouveau mot de passe
        if (new URLSearchParams(location.search).get('reset') === 'ok') {
            document.addEventListener('DOMContentLoaded', () => afficherMessage('login-info', 'Mot de passe modifié ! Tu peux te connecter.'));
        }
    </script>
</body>
</html>
