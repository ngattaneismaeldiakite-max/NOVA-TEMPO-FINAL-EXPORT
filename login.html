<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Connexion - Nova Tempo</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:ital,wght@1,600&display=swap');
        :root {
            --primary-magenta: #0047AB;
            --primary-yellow: #E60023;
            --white: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --metallic-gradient: #E60023;
        }
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; font-family: 'Inter', sans-serif; height: 100vh; background-color: var(--white); }
        .auth-wrapper { display: flex; min-height: 100vh; flex-direction: column; }
        .auth-sidebar { display: none; }
        .auth-sidebar::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,0.8)); z-index: 1; } .auth-sidebar > * { position: relative; z-index: 2; }
        .quote { font-family: 'Playfair Display', serif; font-size: 36px; font-style: italic; line-height: 1.2; margin-bottom: 20px;}
        .auth-content { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; background: #ffffff; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.05); }
        .back-home { position: absolute; top: 30px; left: 30px; text-decoration: none; color: var(--text-muted); font-weight: 700; font-size: 16px; }
        .auth-card { width: 100%; max-width: 400px; padding: 40px; text-align: center; }
        .auth-card h1 { font-size: 28px; font-weight: 800; margin: 0 0 10px 0; letter-spacing: -0.02em; }
        .auth-card p { color: var(--text-muted); margin: 0 0 30px 0; font-size: 15px; }
        .form-group { margin-bottom: 20px; text-align: left; }
        .form-group label { display: block; font-size: 16px; font-weight: 700; color: var(--text-main); margin-bottom: 8px; }
        .form-group input { width: 100%; box-sizing: border-box; padding: 15px; border: 1px solid #e2e8f0; background: #f8fafc; color: #1e293b; transition: all 0.3s ease; border-radius: 12px; font-family: 'Inter', sans-serif; font-size: 15px; }
        .form-group input:focus { outline: none; border-color: #F59E0B; background: #ffffff; box-shadow: 0 0 0 4px rgba(0, 71, 171, 0.1); }
        .auth-links { margin-top: 25px; font-size: 16px; color: var(--text-muted); }
        .auth-links a { color: var(--primary-magenta); font-weight: 700; text-decoration: none; }
        .auth-links a:hover { text-decoration: underline; }
        body { overflow-x: hidden; width: 100%; max-width: 100vw; }
        @media (min-width: 768px) { .auth-wrapper { flex-direction: row-reverse; } .auth-sidebar { display: flex; flex: 1; position: relative; flex-direction: column; justify-content: flex-end; padding: 40px; color: white; background: url('login_bg.jpg') center/cover no-repeat; } }
        .premium-glow-btn { background: linear-gradient(45deg, #E60023, #F59E0B); color: white !important; font-size: 1.2rem; font-weight: 900; padding: 16px; border-radius: 60px; border: none; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; box-shadow: 0 10px 30px rgba(230, 0, 35, 0.3), 0 0 20px rgba(245, 158, 11, 0.2); transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); width: 100%; }
        .premium-glow-btn:hover { transform: translateY(-2px); box-shadow: 0 15px 40px rgba(230, 0, 35, 0.5), 0 0 30px rgba(245, 158, 11, 0.4); }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-sidebar">
            <div>
                <h3 class="quote">Prêt à casser internet ? 🌍</h3>
                <p style="opacity: 0.9; font-size: 16px;">Connecte-toi et lâche ton meilleur hit.</p>
            </div>
        </div>
        <div class="auth-content">
            <a href="index.html" class="back-home">⬅ Retour au site</a>
            <div class="auth-card">
                <h1 style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 900; background: linear-gradient(45deg, #F59E0B, #E60023); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">Te revoilà ! 🔥</h1>
                <p>Connecte-toi pour retrouver ton studio.</p>

                <form autocomplete="off" onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label>Adresse Email</label>
                        <input type="email" id="login-email" placeholder="awa.toure@email.com" required>
                    </div>
                    <div class="form-group">
                        <label>Mot de passe</label>
                        <input type="password" id="login-password" placeholder="••••••••" required>
                    </div>
                    <button type="submit" id="submit-btn" class="premium-glow-btn">Se Connecter</button>
                </form>

                <div class="auth-links">
                    Pas encore de compte ? <a href="signup.html">Rejoindre le Mouvement</a>
                </div>
            </div>
        </div>
    </div>

    <!-- On charge supabase et ton client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const btn = document.getElementById('submit-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Connexion en cours...';
            btn.style.opacity = '0.8';
            btn.style.pointerEvents = 'none';

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                // Vraie vérification du mot de passe avec Supabase
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;
                // Si tout est bon, on va au studio
                window.location.href = 'studio.html';
            } catch (error) {
                console.error("Erreur Connexion:", error.message);
                alert("Erreur de connexion : Vérifie ton email ou ton mot de passe.");
                btn.innerHTML = originalText;
                btn.style.opacity = '1';
                btn.style.pointerEvents = 'auto';
            }
        }
    </script>
</body>
</html>
