    <script>
        const supabaseUrl = 'https://wxkeuyyppzuqplnutwzk.supabase.co';
        const supabaseKey = 'sb_publishable_DrMH4qQCF4s1KyoPjvlJeA_puXHR_rr';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // Correction du système de l'oeil
        const togglePassword = document.getElementById('toggle-password');
        const password = document.getElementById('password');
        
        togglePassword.addEventListener('click', function () {
            if (password.type === 'password') {
                password.type = 'text'; // On rend visible
                this.classList.remove('fa-eye');
                this.classList.add('fa-eye-slash'); // On met l'oeil barré
            } else {
                password.type = 'password'; // On cache
                this.classList.remove('fa-eye-slash');
                this.classList.add('fa-eye'); // On remet l'oeil normal
            }
        });

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pwd = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            const btn = document.querySelector('.btn-submit');
            
            btn.textContent = "CONNEXION EN COURS...";
            errorMsg.style.display = 'none';

            const { data, error } = await supabase.auth.signInWithPassword({ email: email, password: pwd });
            if (error) {
                errorMsg.textContent = "Email ou mot de passe incorrect.";
                errorMsg.style.display = 'block';
                btn.textContent = "SE CONNECTER";
            } else {
                window.location.href = '/profil.html';
            }
        });
    </script>
