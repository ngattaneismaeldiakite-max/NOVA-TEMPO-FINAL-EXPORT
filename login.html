<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Nova Tempo</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@900,700,500,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #06060A;
            --card-bg: #111118;
            --text-light: #FFFFFF;
            --text-muted: rgba(255, 255, 255, 0.6);
            --neon-lime: #D4FF00;
        }
        body { margin: 0; padding: 0; font-family: 'Satoshi', sans-serif; background-color: var(--bg-dark); color: var(--text-light); display: flex; justify-content: center; align-items: center; min-height: 100vh; position: relative; }
        
        .glow-bg { position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(212, 255, 0, 0.15) 0%, rgba(6,6,10,0) 70%); filter: blur(50px); z-index: 0; }

        .auth-container { background: var(--card-bg); padding: 3.5rem 3rem; border-radius: 24px; width: 100%; max-width: 420px; text-align: center; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 20px 50px rgba(0,0,0,0.8); position: relative; z-index: 1; }
        
        .logo { font-size: 1.8rem; font-weight: 900; color: var(--text-light); text-decoration: none; margin-bottom: 2rem; display: inline-block; }
        .logo i { color: var(--neon-lime); }
        h1 { margin: 0 0 0.5rem 0; font-size: 1.8rem; font-weight: 900; text-transform: uppercase; }
        p.subtitle { color: var(--text-muted); margin-bottom: 2.5rem; font-size: 0.95rem; }

        .form-group { margin-bottom: 1.2rem; text-align: left; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; font-size: 0.9rem; color: var(--text-light); }
        input { width: 100%; padding: 1rem; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; background: rgba(255,255,255,0.03); color: var(--text-light); font-family: 'Satoshi', sans-serif; font-size: 1rem; box-sizing: border-box; transition: all 0.3s; }
        input:focus { outline: none; border-color: var(--neon-lime); background: rgba(255,255,255,0.05); box-shadow: 0 0 10px rgba(212, 255, 0, 0.2); }

        .btn-submit { width: 100%; padding: 1.2rem; background: var(--neon-lime); border: none; border-radius: 50px; color: var(--bg-dark); font-weight: 900; font-size: 1.05rem; font-family: 'Satoshi', sans-serif; cursor: pointer; transition: all 0.3s; margin-top: 1rem; text-transform: uppercase; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 0 20px rgba(212, 255, 0, 0.4); }

        .switch-link { margin-top: 2rem; color: var(--text-muted); font-size: 0.9rem; }
        .switch-link a { color: var(--neon-lime); text-decoration: none; font-weight: 700; }
        .switch-link a:hover { text-decoration: underline; }

        .error-message { background: rgba(255, 0, 102, 0.1); color: #FF0066; padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; font-size: 0.9rem; font-weight: 600; display: none; border: 1px solid rgba(255, 0, 102, 0.2); }
    </style>
</head>
<body>
    <div class="glow-bg"></div>
    <div class="auth-container">
        <a href="/" class="logo"><i class="fas fa-asterisk"></i> NOVA TEMPO</a>
        <h1>Bienvenue</h1>
        <p class="subtitle">Connectez-vous pour accéder au studio.</p>

        <div id="errorMessage" class="error-message"></div>

        <form id="loginForm">
            <div class="form-group">
                <label>Adresse E-mail</label>
                <input type="email" id="email" required placeholder="vous@exemple.com">
            </div>
            <div class="form-group">
                <label>Mot de passe</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-submit" id="submitBtn">Se connecter</button>
        </form>

        <div class="switch-link">
            Pas encore de compte ? <a href="/signup.html">S'inscrire</a>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://wxkeuyyppzuqplnutwzk.supabase.co';
        const supabaseKey = 'sb_publishable_DrMH4qQCF4s1KyoPjvlJeA_puXHR_rr';
        window.supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errorBox = document.getElementById('errorMessage');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            btn.disabled = true; btn.textContent = 'Connexion...'; errorBox.style.display = 'none';

            const { data, error } = await window.supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                errorBox.textContent = 'Email ou mot de passe incorrect.';
                errorBox.style.display = 'block';
                btn.disabled = false; btn.textContent = 'Se connecter';
            } else {
                window.location.href = '/studio.html';
            }
        });
    </script>
</body>
</html>
